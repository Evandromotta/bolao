<!DOCTYPE html>
<!--
  Bolão da Copa do Mundo 2026
  ---------------------------
  Aplicação single-page (HTML + CSS + JS puro, sem frameworks ou build step)
  para gerenciar um bolão de apostas esportivas entre participantes.

  Autor: Evandro Motta
  Stack: HTML5 / CSS3 / JavaScript (ES2017+) / SVG inline / Firebase Realtime Database
  Hospedagem: GitHub + Vercel (deploy automático a cada push)

  Principais decisões de arquitetura:
  - Zero dependências externas de runtime (sem React/Vue/jQuery) — o app inteiro
    cabe em um único arquivo, facilitando deploy estático em qualquer CDN.
  - Bandeiras desenhadas em SVG inline (sem requisições a CDNs de imagem),
    evitando bloqueios de conteúdo misto e reduzindo o tempo de carregamento.
  - Persistência via Firebase Realtime Database (REST API simples via fetch),
    com fallback automático para localStorage quando rodando fora de um
    ambiente com storage compartilhado configurado.
  - Renderização feita via template strings + innerHTML, sem virtual DOM —
    suficiente para o volume de elementos desta tela (até ~72 partidas).
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão da Copa do Mundo 2026</title>
<style>
/* Tipografia: Oswald para títulos/placar (estética de telão de estádio),
   Inter para texto corrido e JetBrains Mono para dados tabulares/horários */
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');


:root{
  --bg:#0A1410;
  --surface:#11201A;
  --surface-2:#1B2D24;
  --line:rgba(255,255,255,.08);
  --turf:#34C77B;
  --turf-dim:#1F7A4A;
  --amber:#FFC845;
  --cream:#F3F1E6;
  --muted:#8AA39A;
  --bad:#FF6F6F;
}

*{box-sizing:border-box;}
body{margin:0;}
.app{
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(52,199,123,.12), transparent 60%),
    var(--bg);
  color:var(--cream);
  min-height:100%;
  padding-bottom:40px;
}

/* ---------- HERO ---------- */
.hero{
  padding:36px 20px 24px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(160deg, rgba(31,122,74,.35), transparent 70%);
}
.hero .eyebrow{
  font-family:'JetBrains Mono', monospace;
  font-size:.72rem;
  letter-spacing:.22em;
  color:var(--turf);
  text-transform:uppercase;
  margin:0 0 6px;
}
.hero h1{
  font-family:'Oswald', sans-serif;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  font-size:clamp(1.8rem, 6vw, 3rem);
  margin:0;
  line-height:1.05;
}
.hero h1 span{color:var(--amber);}
.legend{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px;
}
.legend-chip{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 14px;
  font-size:.78rem;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
}
.legend-chip b{
  font-family:'Oswald',sans-serif;
  font-size:.95rem;
  color:var(--cream);
}
.dot{width:10px;height:10px;border-radius:50%;}
.dot.exact{background:var(--turf);}
.dot.result{background:var(--amber);}
.dot.miss{background:var(--bad);}

/* ---------- TABS ---------- */
.tabbar{
  position:sticky;top:0;z-index:20;
  display:flex;
  background:rgba(10,20,16,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.tab{
  flex:1;
  text-align:center;
  padding:14px 8px;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-size:.85rem;
  color:var(--muted);
  background:none;border:none;cursor:pointer;
  border-bottom:3px solid transparent;
  transition:.15s;
}
.tab.active{
  color:var(--amber);
  border-bottom-color:var(--amber);
}
.tab:hover{color:var(--cream);}

/* ---------- FILTER ROWS ---------- */
.filters{
  display:flex;
  gap:8px;
  padding:14px 20px 4px;
  overflow-x:auto;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none;}
.pill{
  flex:0 0 auto;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  letter-spacing:.05em;
  font-size:.8rem;
  text-transform:uppercase;
  padding:8px 16px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--muted);
  cursor:pointer;
  transition:.15s;
  white-space:nowrap;
}
.pill.active{
  background:var(--turf);
  color:#06160E;
  border-color:var(--turf);
}
.pill:hover:not(.active){border-color:var(--turf);color:var(--cream);}

.participant-row{
  display:flex;gap:8px;align-items:center;
  padding:14px 20px 4px;
  flex-wrap:wrap;
}
.add-participant{
  display:flex;gap:6px;align-items:center;
}
.add-participant input{
  font-family:'Inter',sans-serif;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 14px;
  color:var(--cream);
  font-size:.82rem;
  outline:none;
  width:150px;
}
.add-participant input:focus{border-color:var(--turf);}
.add-participant button, .icon-btn{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  background:var(--turf-dim);
  color:var(--cream);
  border:1px solid var(--turf);
  border-radius:999px;
  padding:8px 16px;
  font-size:.78rem;
  letter-spacing:.05em;
  text-transform:uppercase;
  cursor:pointer;
}
.add-participant button:hover{background:var(--turf);color:#06160E;}
/* ---------- ROUND NAV ---------- */
.round-nav{
  display:flex;align-items:center;justify-content:center;gap:18px;
  padding:14px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.round-nav .rn-title{
  font-family:'Oswald',sans-serif;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  font-size:.95rem;color:var(--cream);
  min-width:140px;text-align:center;
}
.round-nav .rn-arrow{
  width:32px;height:32px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface-2);
  color:var(--turf);font-size:1.1rem;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.15s;
}
.round-nav .rn-arrow:hover{border-color:var(--turf);}

/* ---------- MATCH LIST (modelo "rodada") ---------- */
.match-list{
  background:#EEF2F0;
  padding:18px 16px 32px;
  display:flex;flex-direction:column;gap:12px;
}
.match-row{
  max-width:560px;width:100%;margin:0 auto;
  background:#FFFFFF;
  border:1px solid #E1E6E3;
  border-radius:12px;
  padding:14px 16px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.match-row .match-head{
  text-align:center;
  font-size:.74rem;
  color:#8C9A95;
  font-weight:600;
  margin-bottom:10px;
  letter-spacing:.02em;
}
.match-row .match-head .stadium{color:#33433C;font-weight:700;}
.match-row .match-body{
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.match-row .side{
  flex:1;min-width:0;
  display:flex;align-items:center;gap:8px;
  font-family:'Oswald',sans-serif;font-weight:600;font-size:.9rem;
  color:#33433C;
}
.match-row .side.home{justify-content:flex-end;text-align:right;}
.match-row .side.away{justify-content:flex-start;text-align:left;}
.match-row .side .tname{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.match-row .side .flag{
  flex:0 0 auto;
  width:26px;height:19px;
  border-radius:3px;
  overflow:hidden;
  box-shadow:0 0 0 1px #E1E6E3;
  background:#F1F5F2;
  display:inline-block;
  line-height:0;
}
.match-row .side .flag svg{
  display:block;width:100%;height:100%;
}
.match-row .score{
  display:flex;align-items:center;gap:6px;flex:0 0 auto;
}
.match-row .score input{
  width:38px;height:38px;text-align:center;
  font-family:'Oswald',sans-serif;font-weight:700;font-size:1.2rem;
  color:#1F7A4A;
  background:#F1F5F2;
  border:1px solid #DCE4E0;border-radius:8px;
  outline:none;-moz-appearance:textfield;
}
.match-row .score input::-webkit-outer-spin-button,
.match-row .score input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.match-row .score input:focus{border-color:var(--turf);box-shadow:0 0 0 3px rgba(52,199,123,.15);}
.match-row .score .x{font-family:'Oswald',sans-serif;font-weight:700;color:#B7C2BD;}
.match-row .score input:disabled{
  background:#E9EDEA;color:#A8B5AF;border-color:#E1E6E3;
  cursor:not-allowed;
}
.match-row .lock-tag{
  display:inline-block;margin-left:8px;
  font-family:'Oswald',sans-serif;font-weight:700;font-size:.62rem;
  letter-spacing:.06em;text-transform:uppercase;
  color:#B58A00;
}
.match-row .lock-tag.confirmed{color:var(--turf-dim);}
.confirm-row{
  display:flex;align-items:center;justify-content:center;gap:8px;
  flex-wrap:wrap;
}
.confirmed-badge{
  font-family:'Oswald',sans-serif;font-weight:700;
  font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--turf-dim);
}
.confirm-btn{
  font-family:'Oswald',sans-serif;font-weight:700;
  font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;
  border-radius:999px;padding:7px 16px;cursor:pointer;
  border:1px solid var(--turf-dim);background:var(--turf-dim);color:#fff;
}
.confirm-btn:hover{background:#176038;}
.unlock-pick-btn{
  font-family:'Oswald',sans-serif;font-weight:700;
  font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;
  border-radius:999px;padding:5px 12px;cursor:pointer;
  border:1px solid #DCE4E0;background:#FFFFFF;color:#33433C;
}
.match-row .match-foot{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  text-align:center;margin-top:10px;padding-top:10px;
  border-top:1px solid #EEF2F0;
}
.match-row .saiba{
  font-family:'Oswald',sans-serif;font-weight:700;
  font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--turf-dim);
}
.match-row .result-line{
  display:flex;align-items:center;gap:8px;letter-spacing:.04em;
}
.mini-flag{
  display:inline-block;line-height:0;
  width:20px;height:15px;border-radius:2px;overflow:hidden;
  box-shadow:0 0 0 1px #E1E6E3;
}
.mini-flag svg{display:block;width:100%;height:100%;}
.match-row .group-tag{
  display:inline-block;
  font-family:'Oswald',sans-serif;font-weight:700;font-size:.62rem;
  letter-spacing:.1em;
  padding:2px 8px;border-radius:999px;
  margin-left:8px;
  color:#fff;
  background:var(--accent, var(--turf));
  vertical-align:middle;
}
.badge{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:.7rem;
  letter-spacing:.05em;
  text-transform:uppercase;
  padding:4px 10px;
  border-radius:999px;
}
.badge.exact{background:rgba(52,199,123,.16); color:var(--turf-dim); border:1px solid var(--turf);}
.badge.result{background:rgba(255,200,69,.18); color:#A8780B; border:1px solid var(--amber);}
.badge.miss{background:rgba(255,111,111,.14); color:#C23A3A; border:1px solid var(--bad);}
.badge.pending{background:#F1F5F2; color:#8C9A95; border:1px solid #DCE4E0;}

/* ---------- LEADERBOARD ---------- */
.board{
  padding:20px;
  display:flex;flex-direction:column;gap:10px;
}
.board-row{
  display:flex;align-items:center;gap:14px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 18px;
}
.rank{
  font-family:'Oswald',sans-serif;
  font-weight:700;font-size:1.3rem;
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--muted);
  flex:0 0 auto;
}
.board-row:nth-child(1) .rank{background:var(--amber);color:#06160E;}
.board-row:nth-child(2) .rank{background:#C9D3CE;color:#06160E;}
.board-row:nth-child(3) .rank{background:#C98A4B;color:#06160E;}
/* posições via data-pos (usada quando há empates: dois 1ºs, dois 2ºs, etc.) */
.board-row[data-pos="1"] .rank{background:var(--amber);color:#06160E;}
.board-row[data-pos="2"] .rank{background:#C9D3CE;color:#06160E;}
.board-row[data-pos="3"] .rank{background:#C98A4B;color:#06160E;}
.board-name{
  flex:1;
  font-family:'Oswald',sans-serif;
  font-weight:600;font-size:1.05rem;
  text-transform:uppercase;letter-spacing:.03em;
}
.board-stats{
  display:flex;gap:18px;align-items:center;
  font-family:'JetBrains Mono',monospace;
  font-size:.75rem;color:var(--muted);
}
.board-stats .pts{
  font-family:'Oswald',sans-serif;
  font-size:1.5rem;font-weight:700;color:var(--amber);
  min-width:64px;text-align:right;
}
.board-stats .pts span{font-size:.7rem;color:var(--muted);font-family:'Inter',sans-serif;text-transform:uppercase;margin-left:4px;}
.empty{
  text-align:center;color:var(--muted);
  padding:50px 20px;font-size:.9rem;
}
.sync{
  text-align:center;font-size:.7rem;color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  padding:6px 0 0;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.shared-note{
  text-align:center;font-size:.72rem;color:var(--muted);
  padding:12px 20px 0;
}

/* ---------- BARRA DA ABA RESULTADOS ---------- */
.results-bar{
  max-width:560px;margin:0 auto;
  background:#EEF2F0;
  display:flex;flex-wrap:wrap;gap:10px;
  align-items:center;justify-content:space-between;
  padding:18px 16px 4px;
}
.results-bar-info{
  font-size:.72rem;color:var(--muted);
  display:flex;align-items:center;gap:6px;
}
.results-bar-info b{color:var(--cream);font-family:'JetBrains Mono',monospace;}
.results-bar-actions{display:flex;gap:8px;flex-wrap:wrap;}
.bar-btn{
  font-family:'Oswald',sans-serif;font-weight:600;
  letter-spacing:.04em;font-size:.74rem;text-transform:uppercase;
  border-radius:999px;padding:8px 14px;cursor:pointer;
  border:1px solid #DCE4E0;background:#FFFFFF;color:#33433C;
}
.bar-btn.primary{
  background:var(--turf-dim);border-color:var(--turf);color:#fff;
}
.bar-btn:hover{border-color:var(--turf);}
.modal-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(6,16,12,.72);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.modal-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:24px;
  max-width:320px;width:100%;
  text-align:center;
}
.modal-box h3{
  font-family:'Oswald',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;
  font-size:1.05rem;margin:0 0 8px;color:var(--cream);
}
.modal-box p{
  font-size:.8rem;color:var(--muted);margin:0 0 16px;
}
.confirm-score-line{
  display:flex;align-items:center;justify-content:center;gap:8px;
  flex-wrap:wrap;
  font-family:'Oswald',sans-serif;font-weight:600;
  font-size:.95rem;color:var(--cream);
  margin-bottom:10px;
}
.confirm-score-line b{
  color:var(--amber);font-size:1.2rem;letter-spacing:.05em;
}
.modal-box input{
  width:100%;
  font-family:'JetBrains Mono',monospace;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  color:var(--cream);
  font-size:1rem;
  text-align:center;
  outline:none;
  margin-bottom:10px;
}
.modal-box input:focus{border-color:var(--amber);}
.modal-box .modal-actions{
  display:flex;gap:8px;
}
.modal-box button{
  flex:1;
  font-family:'Oswald',sans-serif;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;
  font-size:.78rem;
  border-radius:8px;
  padding:10px;
  cursor:pointer;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--muted);
}
.modal-box button.primary{
  background:var(--turf-dim);
  border-color:var(--turf);
  color:var(--cream);
}
.modal-box button.primary:hover{background:var(--turf);color:#06160E;}
.modal-box .modal-error{
  color:var(--bad);font-size:.75rem;margin:-4px 0 10px;
  min-height:1em;
}

@media (max-width:480px){
  .match-row .side .flag{font-size:1.2rem;}
  .match-row .score input{width:34px;height:34px;font-size:1.05rem;}
  .match-row{padding:12px;}
  .match-row .side{font-size:.78rem;}
  .round-nav .rn-title{min-width:110px;font-size:.82rem;}
}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="hero">
    <p class="eyebrow">Copa do Mundo 2026 · Fase de Grupos · 12 grupos · 72 jogos</p>
    <h1>BOLÃO DA <span>COPA</span></h1>
    <div class="legend">
      <div class="legend-chip"><span class="dot exact"></span> Placar exato = <b>3 pts</b></div>
      <div class="legend-chip"><span class="dot result"></span> Resultado certo = <b>1 pt</b></div>
      <div class="legend-chip"><span class="dot miss"></span> Errou = <b>0 pts</b></div>
    </div>
  </div>

  <div class="tabbar">
    <button class="tab active" data-tab="palpites">Palpites</button>
    <button class="tab" data-tab="resultados">Resultados</button>
    <button class="tab" data-tab="classificacao">Classificação</button>
  </div>

  <div id="participantRow" class="participant-row"></div>
  <div id="filterRow" class="filters"></div>
  <div id="roundNav"></div>
  <div id="content"></div>
  <p class="shared-note" id="shareNote"></p>
</div>

<div class="modal-overlay" id="pwModal" style="display:none">
  <div class="modal-box">
    <h3>Área de Resultados</h3>
    <p>Digite a senha para lançar/editar os resultados oficiais ou desbloquear palpites confirmados.</p>
    <input type="password" id="pwInput" placeholder="Senha" inputmode="numeric">
    <div class="modal-error" id="pwError"></div>
    <div class="modal-actions">
      <button id="pwCancel">Cancelar</button>
      <button class="primary" id="pwConfirm">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal" style="display:none">
  <div class="modal-box">
    <h3>Confirmar palpite</h3>
    <p id="confirmText"></p>
    <div class="modal-actions">
      <button id="confirmCancel">Cancelar</button>
      <button class="primary" id="confirmYes">Confirmar</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
 * DADOS DA FASE DE GRUPOS
 * =====================================================================
 * Tabela estática com as 72 partidas da fase de grupos (12 grupos, 6
 * jogos cada). Cada registro carrega tudo que a interface precisa:
 *
 *   id  - identificador único da partida (usado nas chaves de storage)
 *   g   - grupo (A..L)
 *   d   - data no formato dd/mm (ano fixo: 2026)
 *   r   - rodada do grupo (1, 2 ou 3)
 *   t   - horário de início, já convertido para horário de Brasília
 *   st  - estádio
 *   hi/ai - código ISO do país (mandante/visitante), usado para
 *           selecionar a bandeira em FLAG_SVG
 *   h/a   - nome do país em português (exibição)
 *   he/ae - nome do país em inglês (usado para casar com APIs externas)
 *   hc/ac - sigla de 3 letras (placar estilo "BRA x ARG")
 */
const MATCHES = [
{id:1,g:"A",d:"11/06",r:1,t:"16:00",st:"Azteca",hi:"mx",h:"México",he:"Mexico",hc:"MEX",ai:"za",a:"África do Sul",ae:"South Africa",ac:"RSA"},
{id:2,g:"A",d:"11/06",r:1,t:"23:00",st:"Akron",hi:"kr",h:"Coreia do Sul",he:"South Korea",hc:"KOR",ai:"cz",a:"Tchéquia",ae:"Czech Republic",ac:"CZE"},
{id:3,g:"A",d:"18/06",r:2,t:"13:00",st:"Mercedes-Benz",hi:"cz",h:"Tchéquia",he:"Czech Republic",hc:"CZE",ai:"za",a:"África do Sul",ae:"South Africa",ac:"RSA"},

// passos de 30° na roda de cores), usada como borda superior dos cards
const GROUPS = ["A","B","C","D","E","F","G","H","I","J","K","L"];
const groupHue = g => GROUPS.indexOf(g) * 30;
const groupColor = g => `hsl(${groupHue(g)}, 55%, 52%)`;

/* =====================================================================
 * CONFIGURAÇÃO DE PERSISTÊNCIA E REGRAS DO BOLÃO
 * ===================================================================== */
const RESULTS_KEY = "resultados_oficiais";
const PARTICIPANTS_KEY = "participantes_bolao";
const MANUAL_KEY = "resultados_manuais"; // ids de jogos editados manualmente (não sobrescritos pela auto-atualização)

// Resultados já conhecidos/realizados, para não precisar digitar de novo na primeira vez.
// Use o ID do jogo (veja MATCHES acima) -> {h: gols casa, a: gols visitante}.
// Esses valores só são aplicados se ainda não houver nada salvo para o jogo.
const SEED_RESULTS = {
  1: {h:"2", a:"0"},  // México 2 x 0 África do Sul
  2: {h:"2", a:"1"},  // Coreia do Sul 2 x 1 Tchéquia
};

// Senha exigida para liberar a edição manual da aba "Resultados" e para
// desbloquear palpites já confirmados. Validação simples no cliente —
// suficiente para coibir alterações acidentais entre os participantes,
// mas não deve ser tratada como controle de acesso real (o valor fica
// visível para quem inspecionar o código-fonte).
const RESULTS_PASSWORD = "TROQUE_ESTA_SENHA";

/* ---------------------------------------------------------------------
 * Integração opcional com TheSportsDB (API pública e gratuita) para
 * tentar preencher resultados automaticamente. Mantida desativada por
 * padrão: nos testes, a granularidade de atualização da API conflitou
 * com correções manuais já aplicadas. O código permanece pronto para
 * reativação (AUTO_UPDATE_ENABLED = true) caso uma fonte mais confiável
 * seja integrada no futuro.
 * --------------------------------------------------------------------- */
const SPORTSDB_KEY = "123";
const SPORTSDB_LEAGUE_ID = "4429"; // ID da competição na base do TheSportsDB
const AUTO_REFRESH_MS = 5 * 60 * 1000; // intervalo de polling, em ms

const AUTO_UPDATE_ENABLED = false;

// Normaliza nomes de seleção para comparação tolerante a acentos,
// maiúsculas/minúsculas e sufixos comuns ("Republic", "Kingdom" etc.)
function normTeam(s){
  return (s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/republic|island|kingdom|the|fc|national/g,"")
    .replace(/[^a-z]/g,"");
}

// Converte "dd/mm" (formato interno) para "YYYY-MM-DD" (formato da API)
function dateToISO(dStr){
  const [dd, mm] = dStr.split("/");
  return `2026-${mm}-${dd}`;
}

async function fetchDayEvents(dateISO){
  try{
    const url = `https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/eventsday.php?d=${dateISO}&l=${SPORTSDB_LEAGUE_ID}`;
    const res = await fetch(url);
    const data = await res.json();
    return data.events || [];
  }catch(e){ return []; }
}

// Consulta a API por data e tenta casar cada evento retornado com uma
// partida da nossa tabela (mesma data + nomes normalizados). Partidas
// já corrigidas manualmente (state.manualResults) nunca são sobrescritas.
async function autoUpdateResults(){
  if(!AUTO_UPDATE_ENABLED) return;
  let changed = false;
  const dates = [...new Set(MATCHES.map(m=>m.d))];
  for(const d of dates){
    const events = await fetchDayEvents(dateToISO(d));
    if(!events.length) continue;
    for(const ev of events){
      if(ev.intHomeScore===null || ev.intAwayScore===null || ev.intHomeScore===undefined) continue;
      const evHome = normTeam(ev.strHomeTeam);
      const evAway = normTeam(ev.strAwayTeam);
      const match = MATCHES.find(m =>
        m.d===d && normTeam(m.he)===evHome && normTeam(m.ae)===evAway
      );
      if(!match) continue;
      if(state.manualResults.includes(match.id)) continue;
      const h = String(ev.intHomeScore), a = String(ev.intAwayScore);
      const cur = state.results[match.id];
      if(!cur || cur.h!==h || cur.a!==a){
        state.results[match.id] = {h, a};
        changed = true;
      }
    }
  }
  if(changed){
    await storeSet(RESULTS_KEY, state.results);
  }
  state.lastAutoUpdate = new Date();
  // evita interromper a digitação do usuário com um re-render completo
  const typing = document.activeElement && document.activeElement.tagName === "INPUT";
  if(!typing) render();
}

/* =====================================================================
 * ESTADO DA APLICAÇÃO
 * =====================================================================
 * Estado centralizado em um único objeto mutável. Sem framework reativo:
 * cada alteração relevante é seguida por uma chamada explícita a
 * render() (ou a uma atualização pontual de DOM via refreshCardFeedback),
 * mantendo o fluxo de dados previsível e fácil de rastrear.
 */
let state = {
  tab: "palpites",          // aba ativa: palpites | resultados | classificacao
  group: "Todos",           // filtro de grupo selecionado
  round: 1,                 // rodada exibida (1, 2 ou 3)
  participants: [],         // nomes cadastrados no bolão
  active: null,             // participante atualmente selecionado
  results: {},              // resultados oficiais, indexados por id de partida
  manualResults: [],        // ids de partidas corrigidas manualmente (protegidas de sobrescrita)
  lastAutoUpdate: null,
  picks: {},                // palpites por participante: { nome: { idPartida: {h,a,locked} } }
  resultsUnlocked: false,   // true quando o modo administrador está liberado
};

const ORDINAL = {1:"1ª", 2:"2ª", 3:"3ª"};

// Retorna um rótulo relativo ("Hoje", "Ontem", "Amanhã") para a data da
// partida, comparando com a data atual do dispositivo do usuário
function dateLabel(dStr){
  const [dd, mm] = dStr.split("/").map(Number);
  const matchDate = new Date(2026, mm - 1, dd);
  const today = new Date();
  const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const diffDays = Math.round((matchDate - t0) / 86400000);
  if(diffDays === 0) return "Hoje";
  if(diffDays === -1) return "Ontem";
  if(diffDays === 1) return "Amanhã";
  return null;
}

// Verifica se o jogo já começou, considerando data/hora em horário de Brasília (UTC-3)
function matchStarted(match){
  const [dd, mm] = match.d.split("/").map(Number);
  const [hh, mi] = match.t.split(":").map(Number);
  const startUTC = new Date(Date.UTC(2026, mm - 1, dd, hh + 3, mi));
  return new Date() >= startUTC;
}

// Gera uma chave de storage estável a partir do nome do participante
// (remove acentos/caracteres especiais para evitar problemas de encoding)
function slug(name){
  return "palpites_" + name.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,40);
}

/* =====================================================================
 * CAMADA DE PERSISTÊNCIA
 * =====================================================================
 * Abstração simples sobre o backend de armazenamento, com fallback em
 * cascata conforme o ambiente de execução:
 *
 *   1) Firebase Realtime Database, via REST API (fetch + PUT/GET) —
 *      modo padrão em produção, permite estado compartilhado entre
 *      todos os participantes em tempo real.
 *   2) localStorage do navegador — fallback caso a URL do Firebase não
 *      esteja configurada (útil para desenvolvimento local offline).
 *
 * O restante da aplicação só conhece storeGet/storeSet — trocar o
 * backend de persistência não exige mudanças em nenhuma outra função.
 */
const FIREBASE_DB_URL = "https://bolao-financeiro-default-rtdb.firebaseio.com"; // projeto: bolao-financeiro

// Define o backend ativo em tempo de execução: Firebase se a URL estiver
// configurada, senão cai para localStorage (modo single-user/offline)
const STORAGE_MODE = FIREBASE_DB_URL ? "firebase" : "local";

async function storeGet(key){
  if(STORAGE_MODE === "firebase"){
    try{
      const res = await fetch(`${FIREBASE_DB_URL}/bolao/${key}.json`);
      const data = await res.json();
      return data === null ? null : data;
    }catch(e){ return null; }
  }
  try{
    const v = localStorage.getItem("bolao_"+key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}

async function storeSet(key, val){
  if(STORAGE_MODE === "firebase"){
    try{
      await fetch(`${FIREBASE_DB_URL}/bolao/${key}.json`, {
        method: "PUT",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(val)
      });
    }catch(e){ console.error("Falha ao gravar no Firebase:", e); }
    return;
  }
  try{ localStorage.setItem("bolao_"+key, JSON.stringify(val)); }
  catch(e){ console.error("Falha ao gravar no localStorage:", e); }
}

// debounce simples para evitar disparar uma escrita de rede a cada
// tecla digitada — agrupa chamadas sucessivas em uma só após `ms` de inatividade
function debounce(fn, ms){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), ms); };
}

/* =====================================================================
 * REGRA DE PONTUAÇÃO
 * =====================================================================
 * 3 pontos -> placar exato (mandante e visitante corretos)
 * 1 ponto  -> apenas o resultado correto (vitória/empate/derrota),
 *             comparando o sinal da diferença de gols do palpite com
 *             o sinal da diferença de gols do resultado real
 * 0 pontos -> resultado incorreto
 * null     -> sem dado suficiente para calcular (palpite ou resultado
 *             ausente) — tratado de forma diferente de "0 pontos" na UI,
 *             pois um campo vazio não deve contar como aposta em 0x0
 */
function calcPoints(pick, real){
  if(!pick || !real) return null;
  if(pick.h===undefined||pick.h===null||pick.h===""||pick.a===""||pick.a===undefined||pick.a===null) return null;
  if(real.h===undefined||real.h===null||real.h===""||real.a===""||real.a===undefined||real.a===null) return null;
  const ph=+pick.h, pa=+pick.a, rh=+real.h, ra=+real.a;
  if([ph,pa,rh,ra].some(isNaN)) return null;
  if(ph===rh && pa===ra) return 3;
  const s1 = Math.sign(ph-pa), s2 = Math.sign(rh-ra);
  return s1===s2 ? 1 : 0;
}

// Carrega (uma única vez, com memoização em state.picks) os palpites
// salvos de um participante específico
async function ensurePicks(name){
  if(!state.picks[name]) state.picks[name] = await storeGet(slug(name)) || {};
  return state.picks[name];
}

const saveResults = debounce(async () => {
  await storeSet(RESULTS_KEY, state.results);
}, 400);

const saveParticipants = async () => {
  await storeSet(PARTICIPANTS_KEY, state.participants);
};

/* =====================================================================
 * RENDERIZAÇÃO — HELPERS DE COMPONENTES
 * ===================================================================== */
function matchScoreInputs(match, mode){
  let hVal="", aVal="", confirmed=false;
  if(mode==="palpites" && state.active){
    const p = state.picks[state.active]?.[match.id];
    if(p){ hVal = p.h ?? ""; aVal = p.a ?? ""; confirmed = !!p.locked; }
  } else if(mode==="resultados" || mode==="resultados-view"){
    const r = state.results[match.id];
    if(r){ hVal = r.h ?? ""; aVal = r.a ?? ""; }
  }
  const lockedByKickoff = mode==="palpites" && matchStarted(match);
  const lockedByConfirm = mode==="palpites" && confirmed && !state.resultsUnlocked;
  const dis = (lockedByKickoff || lockedByConfirm || mode==="resultados-view") ? "disabled" : "";
  return `
    <div class="score">
      <input type="number" min="0" max="20" inputmode="numeric" placeholder="${mode==='resultados-view' ? '-' : ''}" value="${hVal}" ${dis}
        data-match="${match.id}" data-side="h" data-mode="${mode}">
      <span class="x">×</span>
      <input type="number" min="0" max="20" inputmode="numeric" placeholder="${mode==='resultados-view' ? '-' : ''}" value="${aVal}" ${dis}
        data-match="${match.id}" data-side="a" data-mode="${mode}">
    </div>`;
}

// Selo de pontuação exibido no card de cada partida, na aba de palpites
function pointsBadge(match){
  if(!state.active) return "";
  const real = state.results[match.id];
  const pick = state.picks[state.active]?.[match.id];
  const pts = calcPoints(pick, real);
  if(real===undefined || real?.h==="" || real?.h===undefined){
    return `<span class="badge pending">Aguardando</span>`;
  }
  if(pts===null) return `<span class="badge pending">Sem palpite</span>`;
  if(pts===3) return `<span class="badge exact">+3 placar exato</span>`;
  if(pts===1) return `<span class="badge result">+1 resultado</span>`;
  return `<span class="badge miss">0 pts</span>`;
}

// Monta o rodapé de cada card na aba "Palpites": resultado oficial (se
// já houver), selo de pontuação e a ação de confirmar/desbloquear o
// palpite daquela partida específica
function footContent(match){
  const r = state.results[match.id];
  const hasResult = r && r.h!=="" && r.h!==undefined && r.a!=="" && r.a!==undefined;
  const resultLine = hasResult
    ? `<span class="saiba result-line">
         ${flagSVG(match.hi,"mini-flag")}
         ${r.h} × ${r.a}
         ${flagSVG(match.ai,"mini-flag")}
       </span>`
    : `<span class="saiba" style="color:#B7C2BD">Aguardando resultado</span>`;

  const pick = state.picks[state.active]?.[match.id];
  const started = matchStarted(match);
  const hasPick = pick && pick.h!=="" && pick.h!==undefined && pick.a!=="" && pick.a!==undefined;
  const confirmed = pick && pick.locked;

  let confirmRow = "";
  if(!started){
    if(confirmed){
      confirmRow = `<div class="confirm-row">
          <span class="confirmed-badge">✅ Palpite confirmado</span>
          ${state.resultsUnlocked ? `<button class="unlock-pick-btn" data-unlock-pick="${match.id}">🔓 Desbloquear</button>` : ""}
        </div>`;
    } else if(hasPick){
      confirmRow = `<div class="confirm-row">
          <button class="confirm-btn" data-confirm-pick="${match.id}">✅ Confirmar palpite</button>
        </div>`;
    }
  }

  return `${resultLine}${pointsBadge(match)}${confirmRow}`;
}

// Monta o card completo de uma partida (cabeçalho com estádio/data/hora,
// bandeiras + placar, e o rodapé de feedback quando aplicável)
function matchRow(match, mode){
  const accent = groupColor(match.g);
  const rel = dateLabel(match.d);
  const dateBits = [match.d];
  if(rel) dateBits.push(rel);
  dateBits.push(match.t);

  const foot = mode==="palpites"
    ? `<div class="match-foot">${footContent(match)}</div>`
    : "";

  const pick = mode==="palpites" ? state.picks[state.active]?.[match.id] : null;
  let lockedTag = "";
  if(mode==="palpites"){
    if(matchStarted(match)) lockedTag = `<span class="lock-tag">🔒 Iniciado</span>`;
    else if(pick && pick.locked) lockedTag = `<span class="lock-tag confirmed">✅ Confirmado</span>`;
  }

  return `
    <div class="match-row" style="--accent:${accent}">
      <div class="match-head">
        <span class="stadium">${match.st}</span>&nbsp; ${dateBits.join(" • ")}
        <span class="group-tag">${match.g}</span>
        ${lockedTag}
      </div>
      <div class="match-body">
        <div class="side home"><span class="tname">${match.h}</span>${flagSVG(match.hi,"flag")}</div>
        ${matchScoreInputs(match, mode)}
        <div class="side away">${flagSVG(match.ai,"flag")}<span class="tname">${match.a}</span></div>
      </div>
      ${foot}
    </div>`;
}

// Aplica o filtro de grupo e, fora da aba "Classificação", também o
// filtro de rodada selecionada
function filteredMatches(){
  let list = state.group==="Todos" ? MATCHES : MATCHES.filter(m=>m.g===state.group);
  if(state.tab!=="classificacao") list = list.filter(m=>m.r===state.round);
  return list;
}

/* =====================================================================
 * RENDERIZAÇÃO — SEÇÕES DA TELA
 * ===================================================================== */
function renderFilters(){
  const row = document.getElementById("filterRow");
  if(state.tab==="classificacao"){ row.innerHTML=""; return; }
  const groups = ["Todos", ...GROUPS];
  row.innerHTML = groups.map(g =>
    `<button class="pill ${g===state.group?'active':''}" data-group="${g}">${g==="Todos"?"Todos":"Grupo "+g}</button>`
  ).join("");
  row.querySelectorAll(".pill").forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.group = btn.dataset.group; render(); });
  });
}

// Lista de participantes (chips clicáveis) + formulário de cadastro +
// alternância do modo administrador
function renderParticipants(){
  const row = document.getElementById("participantRow");
  if(state.tab!=="palpites"){ row.innerHTML=""; return; }
  let html = state.participants.map(p =>
    `<button class="pill ${p===state.active?'active':''}" data-p="${p}">${p}</button>`
  ).join("");
  html += `<div class="add-participant">
      <input type="text" id="newParticipant" placeholder="Nome do participante" maxlength="24">
      <button id="addParticipantBtn">Adicionar</button>
    </div>`;
  html += state.resultsUnlocked
    ? `<button class="pill" id="adminToggle" style="margin-left:auto">🔓 Admin ativo</button>`
    : `<button class="pill" id="adminToggle" style="margin-left:auto">🔐 Admin</button>`;
  row.innerHTML = html;

  document.getElementById("adminToggle").addEventListener("click", ()=>{
    if(state.resultsUnlocked){
      state.resultsUnlocked = false;
      try{ sessionStorage.removeItem("bolao_results_unlocked"); }catch(e){}
      render();
    } else {
      showPasswordModal();
    }
  });

  row.querySelectorAll(".pill[data-p]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      state.active = btn.dataset.p;
      await ensurePicks(state.active);
      render();
    });
  });
  document.getElementById("addParticipantBtn").addEventListener("click", async ()=>{
    const input = document.getElementById("newParticipant");
    const name = input.value.trim();
    if(!name) return;
    if(state.participants.includes(name)) return;
    state.participants.push(name);
    state.active = name;
    await ensurePicks(name);
    await saveParticipants();
    render();
  });
  document.getElementById("newParticipant").addEventListener("keydown", (e)=>{
    if(e.key==="Enter") document.getElementById("addParticipantBtn").click();
  });
}

// Navegação circular entre as 3 rodadas da fase de grupos (‹ 1ª RODADA ›)
function renderRoundNav(){
  const el = document.getElementById("roundNav");
  if(state.tab==="classificacao"){ el.innerHTML=""; return; }
  el.innerHTML = `
    <div class="round-nav">
      <button class="rn-arrow" id="rnPrev">‹</button>
      <span class="rn-title">${ORDINAL[state.round]} RODADA</span>
      <button class="rn-arrow" id="rnNext">›</button>
    </div>`;
  document.getElementById("rnPrev").addEventListener("click", ()=>{
    state.round = state.round===1 ? 3 : state.round-1; render();
  });
  document.getElementById("rnNext").addEventListener("click", ()=>{
    state.round = state.round===3 ? 1 : state.round+1; render();
  });
}

// Dispatcher principal: decide o que desenhar na área de conteúdo de
// acordo com a aba ativa (palpites / resultados / classificação)
async function renderContent(){
  const content = document.getElementById("content");

  if(state.tab==="palpites"){
    if(!state.active){
      content.innerHTML = `<div class="empty">Adicione seu nome acima para começar a registrar seus palpites ⚽</div>`;
      return;
    }
    await ensurePicks(state.active);
    content.innerHTML = `<div class="match-list">${filteredMatches().map(m=>matchRow(m,"palpites")).join("")}</div>`;
    bindScoreInputs("palpites");
    content.querySelectorAll(".match-foot").forEach(bindFootActions);
  }

  else if(state.tab==="resultados"){
    const mode = state.resultsUnlocked ? "resultados" : "resultados-view";

    const bar = `
      <div class="results-bar" style="justify-content:center">
        <div class="results-bar-actions">
          ${AUTO_UPDATE_ENABLED ? `<button id="refreshBtn" class="bar-btn">🔄 Atualizar agora</button>` : ""}
          ${state.resultsUnlocked
            ? `<button id="lockBtn" class="bar-btn">🔒 Bloquear edição</button>`
            : `<button id="unlockBtn2" class="bar-btn primary">Atualizar Placar</button>`}
        </div>
      </div>`;

    content.innerHTML = bar + `<div class="match-list">${filteredMatches().map(m=>matchRow(m,mode)).join("")}</div>`;

    if(AUTO_UPDATE_ENABLED){
      document.getElementById("refreshBtn").addEventListener("click", async (e)=>{
        e.target.textContent = "Atualizando...";
        await autoUpdateResults();
        render();
      });
    }
    if(state.resultsUnlocked){
      document.getElementById("lockBtn").addEventListener("click", ()=>{
        state.resultsUnlocked = false;
        try{ sessionStorage.removeItem("bolao_results_unlocked"); }catch(e){}
        render();
      });
      bindScoreInputs("resultados");
    } else {
      document.getElementById("unlockBtn2").addEventListener("click", showPasswordModal);
    }
  }

  else if(state.tab==="classificacao"){
    if(state.participants.length===0){
      content.innerHTML = `<div class="empty">Nenhum participante cadastrado ainda. Vá na aba "Palpites" e adicione participantes.</div>`;
      return;
    }
    for(const p of state.participants) await ensurePicks(p);

    const rows = state.participants.map(name=>{
      let total=0, exact=0, hit=0, played=0;
      for(const m of MATCHES){
        const real = state.results[m.id];
        const pick = state.picks[name]?.[m.id];
        const pts = calcPoints(pick, real);
        if(pts!==null){
          played++;
          total += pts;
          if(pts===3) exact++;
          if(pts===1) hit++;
        }
      }
      return {name, total, exact, hit, played};
    }).sort((a,b)=>{
      // 1º critério: maior pontuação total
      if(b.total !== a.total) return b.total - a.total;
      // 2º critério (desempate): maior número de placares exatos (3 pts)
      if(b.exact !== a.exact) return b.exact - a.exact;
      // 3º critério (desempate): maior número de resultados certos (1 pt)
      return b.hit - a.hit;
    });

    // Calcula a posição real considerando os empates:
    // participantes com exatamente os mesmos 3 critérios ficam
    // na mesma posição (ex: dois participantes empatados na 2ª posição
    // → o próximo começa na 4ª, não na 3ª)
    let pos = 1;
    const positioned = rows.map((r, i)=>{
      if(i > 0){
        const prev = rows[i-1];
        if(r.total !== prev.total || r.exact !== prev.exact || r.hit !== prev.hit) pos = i+1;
      }
      return {...r, pos};
    });

    content.innerHTML = `<div class="board">${positioned.map(r=>`
      <div class="board-row" data-pos="${r.pos}">
        <div class="rank">${r.pos}</div>
        <div class="board-name">${r.name}</div>
        <div class="board-stats">
          <div>${r.exact} <span>Exatos</span></div>
          <div>${r.hit} <span>Resultados</span></div>
          <div>${r.played}/${MATCHES.length} <span>Jogos</span></div>
          <div class="pts">${r.total}<span>pts</span></div>
        </div>
      </div>`).join("")}</div>`;
  }
}

// Vincula os listeners de "input" aos campos de placar de uma aba
// específica. Centraliza tanto o fluxo de palpite (que dispara o modal
// de confirmação) quanto o fluxo de resultado oficial (que marca a
// partida como editada manualmente, protegendo-a de sobrescritas)
function bindScoreInputs(mode){
  document.querySelectorAll(`input[data-mode="${mode}"]`).forEach(inp=>{
    inp.addEventListener("input", async ()=>{
      const id = +inp.dataset.match;
      const side = inp.dataset.side;
      let v = inp.value;
      if(v!=="" ){
        let n = Math.max(0, Math.min(20, parseInt(v,10)||0));
        v = String(n);
        inp.value = v;
      }
      if(mode==="palpites"){
        const obj = state.picks[state.active][id] || {};
        obj[side] = v;
        state.picks[state.active][id] = obj;
        // Gravação proposital adiada: o palpite só é persistido no
        // backend após confirmação explícita no modal (showConfirmModal)
        refreshCardFeedback(id);

        // Quando ambos os campos estiverem preenchidos e a partida
        // ainda não tiver começado, dispara a confirmação automaticamente
        const pick = state.picks[state.active][id];
        const bothFilled = pick.h!=="" && pick.h!==undefined && pick.a!=="" && pick.a!==undefined;
        const match = MATCHES.find(m=>m.id===id);
        if(bothFilled && !pick.locked && !matchStarted(match) && pendingConfirmMatchId===null){
          inp.blur();
          showConfirmModal(id);
        }
      } else {
        const obj = state.results[id] || {};
        obj[side] = v;
        state.results[id] = obj;
        saveResults();
        // marca a partida como corrigida manualmente, para que a
        // (eventual) atualização automática nunca a sobrescreva
        if(!state.manualResults.includes(id)){
          state.manualResults.push(id);
          storeSet(MANUAL_KEY, state.manualResults);
        }
        refreshAllBadgesFor(id);
      }
    });
  });
}

// Atualiza apenas o rodapé do card afetado, evitando um re-render
// completo da lista (e a consequente perda de foco/cursor do input)
function refreshCardFeedback(matchId){
  if(state.tab!=="palpites") return;
  const match = MATCHES.find(m=>m.id===matchId);
  document.querySelectorAll(".match-list .match-row").forEach(card=>{
    if(card.innerHTML.includes(`>${match.h}<`) && card.innerHTML.includes(`>${match.a}<`)){
      const foot = card.querySelector(".match-foot");
      if(foot){
        foot.innerHTML = footContent(match);
        bindFootActions(foot);
      }
    }
  });
}
// Mantido como ponto de extensão: a aba de resultados atualmente não
// precisa de feedback inline além do que já é tratado no fluxo acima
function refreshAllBadgesFor(){}

/* ---------------------------------------------------------------------
 * NAVEGAÇÃO POR ABAS
 * --------------------------------------------------------------------- */
document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", async ()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.tab = btn.dataset.tab;
    state.group = "Todos";
    state.round = 1;
    render();
  });
});

// Orquestra um redesenho completo da tela a partir do estado atual.
// Chamado após qualquer mudança estrutural (troca de aba, de grupo, de
// rodada, login/logout do admin etc.) — atualizações pontuais de um
// único card usam refreshCardFeedback em vez de passar por aqui
async function render(){
  renderParticipants();
  renderFilters();
  renderRoundNav();
  await renderContent();
}

/* =====================================================================
 * MODAL DE SENHA — acesso administrativo
 * =====================================================================
 * Protege a edição manual de resultados e o desbloqueio de palpites já
 * confirmados. É uma barreira de conveniência (evita alterações
 * acidentais entre os participantes), não um mecanismo de autenticação
 * — a comparação acontece inteiramente no cliente.
 */
function showPasswordModal(){
  const modal = document.getElementById("pwModal");
  const input = document.getElementById("pwInput");
  document.getElementById("pwError").textContent = "";
  input.value = "";
  modal.style.display = "flex";
  setTimeout(()=>input.focus(), 50);
}
function hidePasswordModal(){
  document.getElementById("pwModal").style.display = "none";
}
function tryUnlock(){
  const input = document.getElementById("pwInput");
  if(input.value === RESULTS_PASSWORD){
    state.resultsUnlocked = true;
    // persiste o desbloqueio na sessão do navegador, para não pedir a
    // senha de novo a cada troca de aba durante a mesma visita
    try{ sessionStorage.setItem("bolao_results_unlocked","1"); }catch(e){}
    hidePasswordModal();
    render();
  } else {
    document.getElementById("pwError").textContent = "Senha incorreta.";
    input.value = "";
    input.focus();
  }
}
document.getElementById("pwConfirm").addEventListener("click", tryUnlock);
document.getElementById("pwCancel").addEventListener("click", hidePasswordModal);
document.getElementById("pwInput").addEventListener("keydown", (e)=>{
  if(e.key === "Enter") tryUnlock();
});

// Vincula as ações de "Confirmar palpite" e "Desbloquear" (modo admin)
// presentes no rodapé de cada card — chamado tanto no render completo
// quanto após um refreshCardFeedback pontual
function bindFootActions(footEl){
  const confirmBtn = footEl.querySelector("[data-confirm-pick]");
  if(confirmBtn){
    confirmBtn.addEventListener("click", ()=> showConfirmModal(+confirmBtn.dataset.confirmPick));
  }
  const unlockBtn = footEl.querySelector("[data-unlock-pick]");
  if(unlockBtn){
    unlockBtn.addEventListener("click", async ()=>{
      const id = +unlockBtn.dataset.unlockPick;
      state.picks[state.active][id].locked = false;
      await storeSet(slug(state.active), state.picks[state.active]);
      render();
    });
  }
}

/* =====================================================================
 * MODAL DE CONFIRMAÇÃO DE PALPITE
 * =====================================================================
 * Fluxo: ao preencher os dois placares, o palpite fica retido apenas em
 * memória (state) até que o usuário confirme explicitamente. Cancelar
 * limpa os campos sem gravar nada no backend; confirmar persiste o
 * palpite e o marca como "locked" (somente o admin pode reabri-lo).
 */
let pendingConfirmMatchId = null;
function showConfirmModal(matchId){
  const match = MATCHES.find(m=>m.id===matchId);
  const pick = state.picks[state.active][matchId];
  pendingConfirmMatchId = matchId;
  document.getElementById("confirmText").innerHTML =
    `<div class="confirm-score-line">
       ${flagSVG(match.hi,"mini-flag")} ${match.h}
       <b>${pick.h} × ${pick.a}</b>
       ${match.a} ${flagSVG(match.ai,"mini-flag")}
     </div>` +
    `<br>Depois de confirmado, somente o administrador (com senha) poderá alterar este palpite. Confirmar?`;
  document.getElementById("confirmModal").style.display = "flex";
}
function hideConfirmModal(){
  document.getElementById("confirmModal").style.display = "none";
  pendingConfirmMatchId = null;
}
document.getElementById("confirmCancel").addEventListener("click", async ()=>{
  if(pendingConfirmMatchId!=null){
    const id = pendingConfirmMatchId;
    state.picks[state.active][id] = { h:"", a:"" };
    await storeSet(slug(state.active), state.picks[state.active]);
  }
  hideConfirmModal();
  render();
});
document.getElementById("confirmYes").addEventListener("click", async ()=>{
  if(pendingConfirmMatchId==null) return;
  const id = pendingConfirmMatchId;
  state.picks[state.active][id].locked = true;
  await storeSet(slug(state.active), state.picks[state.active]);
  hideConfirmModal();
  render();
});

/* =====================================================================
 * BOOTSTRAP
 * =====================================================================
 * Sequência de inicialização: restaura sessão de admin (se houver),
 * carrega estado persistido do backend, aplica resultados-seed para
 * partidas já encerradas (sem sobrescrever o que já estiver salvo) e
 * dispara o primeiro render. A integração com a API externa de
 * resultados, quando habilitada, é agendada por último.
 */
async function init(){
  try{ if(sessionStorage.getItem("bolao_results_unlocked")==="1") state.resultsUnlocked = true; }catch(e){}

  const note = document.getElementById("shareNote");
  if(STORAGE_MODE === "local"){
    note.innerHTML = "⚠️ Armazenamento compartilhado não configurado: os dados ficam salvos só neste navegador/computador (não sincronizam entre pessoas).";
  } else {
    note.textContent = "Os palpites e resultados ficam salvos para todos que abrirem este bolão.";
  }

  state.participants = await storeGet(PARTICIPANTS_KEY) || [];
  state.results = await storeGet(RESULTS_KEY) || {};

  // Aplica os resultados pré-cadastrados em SEED_RESULTS apenas para
  // partidas que ainda não tenham um resultado salvo no backend
  let seeded = false;
  for(const [id, r] of Object.entries(SEED_RESULTS)){
    if(!state.results[id] || state.results[id].h===undefined || state.results[id].h===""){
      state.results[id] = r;
      seeded = true;
    }
  }
  if(seeded) await storeSet(RESULTS_KEY, state.results);

  state.manualResults = await storeGet(MANUAL_KEY) || [];

  if(state.participants.length) state.active = state.participants[0];
  render();

  if(AUTO_UPDATE_ENABLED){
    autoUpdateResults();
    setInterval(autoUpdateResults, AUTO_REFRESH_MS);
  }
}
init();
</script>
