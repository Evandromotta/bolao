<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão da Copa do Mundo 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');


:root{
  --bg:#0A1410;
  --surface:#11201A;
  --surface-2:#1B2D24;
  --line:rgba(255,255,255,.08);
  --turf:#34C77B;
  --turf-dim:#1F7A4A;
  --amber:#FFC845;
  --cream:#F3F1E6;
  --muted:#8AA39A;
  --bad:#FF6F6F;
}

*{box-sizing:border-box;}
body{margin:0;}
.app{
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(52,199,123,.12), transparent 60%),
    var(--bg);
  color:var(--cream);
  min-height:100%;
  padding-bottom:40px;
}

/* ---------- HERO ---------- */
.hero{
  padding:36px 20px 24px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(160deg, rgba(31,122,74,.35), transparent 70%);
}
.hero .eyebrow{
  font-family:'JetBrains Mono', monospace;
  font-size:.72rem;
  letter-spacing:.22em;
  color:var(--turf);
  text-transform:uppercase;
  margin:0 0 6px;
}
.hero h1{
  font-family:'Oswald', sans-serif;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  font-size:clamp(1.8rem, 6vw, 3rem);
  margin:0;
  line-height:1.05;
}
.hero h1 span{color:var(--amber);}
.legend{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:16px;
}
.legend-chip{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 14px;
  font-size:.78rem;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
}
.legend-chip b{
  font-family:'Oswald',sans-serif;
  font-size:.95rem;
  color:var(--cream);
}
.dot{width:10px;height:10px;border-radius:50%;}
.dot.exact{background:var(--turf);}
.dot.result{background:var(--amber);}
.dot.miss{background:var(--bad);}

/* ---------- TABS ---------- */
.tabbar{
  position:sticky;top:0;z-index:20;
  display:flex;
  background:rgba(10,20,16,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.tab{
  flex:1;
  text-align:center;
  padding:14px 8px;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-size:.85rem;
  color:var(--muted);
  background:none;border:none;cursor:pointer;
  border-bottom:3px solid transparent;
  transition:.15s;
}
.tab.active{
  color:var(--amber);
  border-bottom-color:var(--amber);
}
.tab:hover{color:var(--cream);}

/* ---------- FILTER ROWS ---------- */
.filters{
  display:flex;
  gap:8px;
  padding:14px 20px 4px;
  overflow-x:auto;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none;}
.pill{
  flex:0 0 auto;
  font-family:'Oswald',sans-serif;
  font-weight:600;
  letter-spacing:.05em;
  font-size:.8rem;
  text-transform:uppercase;
  padding:8px 16px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--muted);
  cursor:pointer;
  transition:.15s;
  white-space:nowrap;
}
.pill.active{
  background:var(--turf);
  color:#06160E;
  border-color:var(--turf);
}
.pill:hover:not(.active){border-color:var(--turf);color:var(--cream);}

.participant-row{
  display:flex;gap:8px;align-items:center;
  padding:14px 20px 4px;
  flex-wrap:wrap;
}
.add-participant{
  display:flex;gap:6px;align-items:center;
}
.add-participant input{
  font-family:'Inter',sans-serif;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 14px;
  color:var(--cream);
  font-size:.82rem;
  outline:none;
  width:150px;
}
.add-participant input:focus{border-color:var(--turf);}
.add-participant button, .icon-btn{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  background:var(--turf-dim);
  color:var(--cream);
  border:1px solid var(--turf);
  border-radius:999px;
  padding:8px 16px;
  font-size:.78rem;
  letter-spacing:.05em;
  text-transform:uppercase;
  cursor:pointer;
}
.add-participant button:hover{background:var(--turf);color:#06160E;}
/* ---------- ROUND NAV ---------- */
.round-nav{
  display:flex;align-items:center;justify-content:center;gap:18px;
  padding:14px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.round-nav .rn-title{
  font-family:'Oswald',sans-serif;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  font-size:.95rem;color:var(--cream);
  min-width:140px;text-align:center;
}
.round-nav .rn-arrow{
  width:32px;height:32px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface-2);
  color:var(--turf);font-size:1.1rem;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.15s;
}
.round-nav .rn-arrow:hover{border-color:var(--turf);}

/* ---------- MATCH LIST (modelo "rodada") ---------- */
.match-list{
  background:#EEF2F0;
  padding:18px 16px 32px;
  display:flex;flex-direction:column;gap:12px;
}
.match-row{
  max-width:560px;width:100%;margin:0 auto;
  background:#FFFFFF;
  border:1px solid #E1E6E3;
  border-radius:12px;
  padding:14px 16px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.match-row .match-head{
  text-align:center;
  font-size:.74rem;
  color:#8C9A95;
  font-weight:600;
  margin-bottom:10px;
  letter-spacing:.02em;
}
.match-row .match-head .stadium{color:#33433C;font-weight:700;}
.match-row .match-body{
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.match-row .side{
  flex:1;min-width:0;
  display:flex;align-items:center;gap:8px;
  font-family:'Oswald',sans-serif;font-weight:600;font-size:.9rem;
  color:#33433C;
}
.match-row .side.home{justify-content:flex-end;text-align:right;}
.match-row .side.away{justify-content:flex-start;text-align:left;}
.match-row .side .tname{
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.match-row .side .flag{
  flex:0 0 auto;
  width:26px;height:19px;
  border-radius:3px;
  overflow:hidden;
  box-shadow:0 0 0 1px #E1E6E3;
  background:#F1F5F2;
  display:inline-block;
  line-height:0;
}
.match-row .side .flag svg{
  display:block;width:100%;height:100%;
}
.match-row .score{
  display:flex;align-items:center;gap:6px;flex:0 0 auto;
}
.match-row .score input{
  width:38px;height:38px;text-align:center;
  font-family:'Oswald',sans-serif;font-weight:700;font-size:1.2rem;
  color:#1F7A4A;
  background:#F1F5F2;
  border:1px solid #DCE4E0;border-radius:8px;
  outline:none;-moz-appearance:textfield;
}
.match-row .score input::-webkit-outer-spin-button,
.match-row .score input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.match-row .score input:focus{border-color:var(--turf);box-shadow:0 0 0 3px rgba(52,199,123,.15);}
.match-row .score .x{font-family:'Oswald',sans-serif;font-weight:700;color:#B7C2BD;}
.match-row .score input:disabled{
  background:#E9EDEA;color:#A8B5AF;border-color:#E1E6E3;
  cursor:not-allowed;
}
.match-row .lock-tag{
  display:inline-block;margin-left:8px;
  font-family:'Oswald',sans-serif;font-weight:700;font-size:.62rem;
  letter-spacing:.06em;text-transform:uppercase;
  color:#B58A00;
}
.match-row .lock-tag.confirmed{color:var(--turf-dim);}
.confirm-row{
  display:flex;align-items:center;justify-content:center;gap:8px;
  flex-wrap:wrap;
}
.confirmed-badge{
  font-family:'Oswald',sans-serif;font-weight:700;
  font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--turf-dim);
}
.confirm-btn{
  font-family:'Oswald',sans-serif;font-weight:700;
  font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;
  border-radius:999px;padding:7px 16px;cursor:pointer;
  border:1px solid var(--turf-dim);background:var(--turf-dim);color:#fff;
}
.confirm-btn:hover{background:#176038;}
.unlock-pick-btn{
  font-family:'Oswald',sans-serif;font-weight:700;
  font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;
  border-radius:999px;padding:5px 12px;cursor:pointer;
  border:1px solid #DCE4E0;background:#FFFFFF;color:#33433C;
}
.match-row .match-foot{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  text-align:center;margin-top:10px;padding-top:10px;
  border-top:1px solid #EEF2F0;
}
.match-row .saiba{
  font-family:'Oswald',sans-serif;font-weight:700;
  font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--turf-dim);
}
.match-row .result-line{
  display:flex;align-items:center;gap:8px;letter-spacing:.04em;
}
.mini-flag{
  display:inline-block;line-height:0;
  width:20px;height:15px;border-radius:2px;overflow:hidden;
  box-shadow:0 0 0 1px #E1E6E3;
}
.mini-flag svg{display:block;width:100%;height:100%;}
.match-row .group-tag{
  display:inline-block;
  font-family:'Oswald',sans-serif;font-weight:700;font-size:.62rem;
  letter-spacing:.1em;
  padding:2px 8px;border-radius:999px;
  margin-left:8px;
  color:#fff;
  background:var(--accent, var(--turf));
  vertical-align:middle;
}
.badge{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:.7rem;
  letter-spacing:.05em;
  text-transform:uppercase;
  padding:4px 10px;
  border-radius:999px;
}
.badge.exact{background:rgba(52,199,123,.16); color:var(--turf-dim); border:1px solid var(--turf);}
.badge.result{background:rgba(255,200,69,.18); color:#A8780B; border:1px solid var(--amber);}
.badge.miss{background:rgba(255,111,111,.14); color:#C23A3A; border:1px solid var(--bad);}
.badge.pending{background:#F1F5F2; color:#8C9A95; border:1px solid #DCE4E0;}

/* ---------- LEADERBOARD ---------- */
.board{
  padding:20px;
  display:flex;flex-direction:column;gap:10px;
}
.board-row{
  display:flex;align-items:center;gap:14px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 18px;
}
.rank{
  font-family:'Oswald',sans-serif;
  font-weight:700;font-size:1.3rem;
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--muted);
  flex:0 0 auto;
}
.board-row:nth-child(1) .rank{background:var(--amber);color:#06160E;}
.board-row:nth-child(2) .rank{background:#C9D3CE;color:#06160E;}
.board-row:nth-child(3) .rank{background:#C98A4B;color:#06160E;}
.board-row[data-pos="1"] .rank{background:var(--amber);color:#06160E;}
.board-row[data-pos="2"] .rank{background:#C9D3CE;color:#06160E;}
.board-row[data-pos="3"] .rank{background:#C98A4B;color:#06160E;}
.board-name{
  flex:1;
  font-family:'Oswald',sans-serif;
  font-weight:600;font-size:1.05rem;
  text-transform:uppercase;letter-spacing:.03em;
}
.board-stats{
  display:flex;gap:18px;align-items:center;
  font-family:'JetBrains Mono',monospace;
  font-size:.75rem;color:var(--muted);
}
.board-stats .pts{
  font-family:'Oswald',sans-serif;
  font-size:1.5rem;font-weight:700;color:var(--amber);
  min-width:64px;text-align:right;
}
.board-stats .pts span{font-size:.7rem;color:var(--muted);font-family:'Inter',sans-serif;text-transform:uppercase;margin-left:4px;}
.empty{
  text-align:center;color:var(--muted);
  padding:50px 20px;font-size:.9rem;
}
.sync{
  text-align:center;font-size:.7rem;color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  padding:6px 0 0;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.shared-note{
  text-align:center;font-size:.72rem;color:var(--muted);
  padding:12px 20px 0;
}

/* ---------- BARRA DA ABA RESULTADOS ---------- */
.results-bar{
  max-width:560px;margin:0 auto;
  background:#EEF2F0;
  display:flex;flex-wrap:wrap;gap:10px;
  align-items:center;justify-content:space-between;
  padding:18px 16px 4px;
}
.results-bar-info{
  font-size:.72rem;color:var(--muted);
  display:flex;align-items:center;gap:6px;
}
.results-bar-info b{color:var(--cream);font-family:'JetBrains Mono',monospace;}
.results-bar-actions{display:flex;gap:8px;flex-wrap:wrap;}
.bar-btn{
  font-family:'Oswald',sans-serif;font-weight:600;
  letter-spacing:.04em;font-size:.74rem;text-transform:uppercase;
  border-radius:999px;padding:8px 14px;cursor:pointer;
  border:1px solid #DCE4E0;background:#FFFFFF;color:#33433C;
}
.bar-btn.primary{
  background:var(--turf-dim);border-color:var(--turf);color:#fff;
}
.bar-btn:hover{border-color:var(--turf);}
.modal-overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(6,16,12,.72);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.modal-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:24px;
  max-width:320px;width:100%;
  text-align:center;
}
.modal-box h3{
  font-family:'Oswald',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;
  font-size:1.05rem;margin:0 0 8px;color:var(--cream);
}
.modal-box p{
  font-size:.8rem;color:var(--muted);margin:0 0 16px;
}
.confirm-score-line{
  display:flex;align-items:center;justify-content:center;gap:8px;
  flex-wrap:wrap;
  font-family:'Oswald',sans-serif;font-weight:600;
  font-size:.95rem;color:var(--cream);
  margin-bottom:10px;
}
.confirm-score-line b{
  color:var(--amber);font-size:1.2rem;letter-spacing:.05em;
}
.modal-box input{
  width:100%;
  font-family:'JetBrains Mono',monospace;
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  color:var(--cream);
  font-size:1rem;
  text-align:center;
  outline:none;
  margin-bottom:10px;
}
.modal-box input:focus{border-color:var(--amber);}
.modal-box .modal-actions{
  display:flex;gap:8px;
}
.modal-box button{
  flex:1;
  font-family:'Oswald',sans-serif;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;
  font-size:.78rem;
  border-radius:8px;
  padding:10px;
  cursor:pointer;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--muted);
}
.modal-box button.primary{
  background:var(--turf-dim);
  border-color:var(--turf);
  color:var(--cream);
}
.modal-box button.primary:hover{background:var(--turf);color:#06160E;}
.modal-box .modal-error{
  color:var(--bad);font-size:.75rem;margin:-4px 0 10px;
  min-height:1em;
}


/* ---------- 2ª FASE - CHAVEAMENTO ---------- */
.bracket-section{background:#EEF2F0;padding:18px 16px 32px;}
.ko-row{
  max-width:560px;width:100%;margin:0 auto 12px;
  background:#FFFFFF;border:1px solid #E1E6E3;border-radius:12px;
  padding:14px 16px 14px 20px;box-shadow:0 1px 3px rgba(0,0,0,.04);
  position:relative;
}
.ko-row::before{
  content:"";position:absolute;top:0;left:0;bottom:0;width:4px;
  border-radius:12px 0 0 12px;background:var(--turf);
}
.ko-head{text-align:center;font-size:.72rem;color:#8C9A95;font-weight:600;margin-bottom:10px;letter-spacing:.02em;}
.ko-head .ko-label{color:#33433C;font-weight:700;}
.ko-teams{display:flex;align-items:center;gap:10px;}
.ko-side{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-family:"Oswald",sans-serif;font-weight:600;font-size:.88rem;color:#33433C;}
.ko-side.home{justify-content:flex-end;text-align:right;}
.ko-side.away{justify-content:flex-start;text-align:left;}
.ko-side .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ko-side .flag{flex:0 0 auto;width:26px;height:19px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px #E1E6E3;background:#F1F5F2;display:inline-block;line-height:0;}
.ko-side .flag svg{display:block;width:100%;height:100%;}
.ko-side.tbd .tname{color:#B7C2BD;font-style:italic;}
.ko-score{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
.ko-score input{width:38px;height:38px;text-align:center;font-family:"Oswald",sans-serif;font-weight:700;font-size:1.2rem;color:#1F7A4A;background:#F1F5F2;border:1px solid #DCE4E0;border-radius:8px;outline:none;-moz-appearance:textfield;}
.ko-score input::-webkit-outer-spin-button,.ko-score input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.ko-score input:focus{border-color:var(--turf);box-shadow:0 0 0 3px rgba(52,199,123,.15);}
.ko-score input:disabled{background:#E9EDEA;color:#A8B5AF;border-color:#E1E6E3;cursor:not-allowed;}
.ko-score .x{font-family:"Oswald",sans-serif;font-weight:700;color:#B7C2BD;}
.ko-foot{margin-top:10px;padding-top:10px;border-top:1px solid #EEF2F0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
.advance-picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;}
.advance-label{font-family:"Oswald",sans-serif;font-weight:600;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#8C9A95;}
.advance-btn{font-family:"Oswald",sans-serif;font-weight:700;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:6px 14px;cursor:pointer;border:1px solid #DCE4E0;background:#F1F5F2;color:#33433C;display:flex;align-items:center;gap:6px;transition:.12s;}
.advance-btn.selected{background:var(--turf-dim);border-color:var(--turf);color:#fff;}
.advance-btn:disabled{opacity:.5;cursor:not-allowed;}
.advance-btn .aflag,.official-advance .aflag{display:inline-block;width:18px;height:13px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.1);line-height:0;}
.advance-btn .aflag svg,.official-advance .aflag svg{display:block;width:100%;height:100%;}
.advance-badge{font-family:"Oswald",sans-serif;font-weight:700;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:rgba(52,199,123,.14);color:var(--turf-dim);border:1px solid var(--turf);}
.official-advance{font-family:"Oswald",sans-serif;font-weight:700;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:#33433C;display:flex;align-items:center;gap:6px;justify-content:center;}
.f2-bar{max-width:560px;margin:0 auto 4px;background:#EEF2F0;display:flex;justify-content:center;padding:14px 16px 4px;}
.f2-admin-note{font-family:"Oswald",sans-serif;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:#8C9A95;text-align:center;max-width:560px;margin:0 auto;padding:0 0 12px;}


/* ===== KNOCKOUT PHASE ===== */
.ko-phase-nav{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:10px 16px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  position:sticky;top:93px;z-index:10;
}
.ko-phase-nav::-webkit-scrollbar{display:none;}
.ko-pill{
  flex:0 0 auto;font-family:'Oswald',sans-serif;font-weight:600;
  font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--muted);cursor:pointer;white-space:nowrap;transition:.12s;
}
.ko-pill.active{background:var(--turf);color:#06160E;border-color:var(--turf);}
.ko-pill:hover:not(.active){border-color:var(--turf);color:var(--cream);}

.ko-list{background:#EEF2F0;padding:14px 16px 32px;display:flex;flex-direction:column;gap:12px;}
.ko-card{
  max-width:560px;width:100%;margin:0 auto;
  background:#FFF;border:1px solid #E1E6E3;border-radius:12px;
  padding:13px 16px 13px 20px;box-shadow:0 1px 3px rgba(0,0,0,.04);
  position:relative;
}
.ko-card::before{
  content:"";position:absolute;top:0;left:0;bottom:0;width:4px;
  border-radius:12px 0 0 12px;background:var(--turf);
}
.ko-card-head{
  text-align:center;font-size:.72rem;color:#8C9A95;font-weight:600;
  margin-bottom:10px;letter-spacing:.02em;
}
.ko-card-head strong{color:#33433C;}
.ko-card-body{display:flex;align-items:center;gap:8px;}
.ko-team{
  flex:1;min-width:0;display:flex;align-items:center;gap:7px;
  font-family:'Oswald',sans-serif;font-weight:600;font-size:.88rem;color:#33433C;
}
.ko-team.home{justify-content:flex-end;text-align:right;}
.ko-team.away{justify-content:flex-start;text-align:left;}
.ko-team .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ko-team .koflag{
  flex:0 0 26px;width:26px;height:19px;border-radius:3px;overflow:hidden;
  box-shadow:0 0 0 1px #E1E6E3;background:#F1F5F2;display:inline-block;line-height:0;
}
.ko-team .koflag svg{display:block;width:100%;height:100%;}
.ko-team.tbd .tn{color:#B7C2BD;font-style:italic;}
.ko-score{display:flex;align-items:center;gap:5px;flex:0 0 auto;}
.ko-score input{
  width:38px;height:38px;text-align:center;
  font-family:'Oswald',sans-serif;font-weight:700;font-size:1.15rem;
  color:#1F7A4A;background:#F1F5F2;border:1px solid #DCE4E0;border-radius:8px;
  outline:none;-moz-appearance:textfield;
}
.ko-score input::-webkit-outer-spin-button,.ko-score input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.ko-score input:focus{border-color:var(--turf);box-shadow:0 0 0 3px rgba(52,199,123,.15);}
.ko-score input:disabled{background:#E9EDEA;color:#A8B5AF;border-color:#E1E6E3;cursor:not-allowed;}
.ko-score .kox{font-family:'Oswald',sans-serif;font-weight:700;color:#B7C2BD;}
.ko-foot{
  margin-top:9px;padding-top:9px;border-top:1px solid #EEF2F0;
  display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;
}
/* seletor de quem avança */
.adv-picker{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center;}
.adv-lbl{font-family:'Oswald',sans-serif;font-weight:600;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:#8C9A95;}
.adv-btn{
  font-family:'Oswald',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;
  border-radius:999px;padding:5px 12px;cursor:pointer;border:1px solid #DCE4E0;
  background:#F1F5F2;color:#33433C;display:flex;align-items:center;gap:5px;transition:.1s;
}
.adv-btn.on{background:var(--turf-dim);border-color:var(--turf);color:#fff;}
.adv-btn:disabled{opacity:.45;cursor:not-allowed;}
.adv-btn .af{display:inline-block;width:17px;height:12px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.1);line-height:0;}
.adv-btn .af svg{display:block;width:100%;height:100%;}
.adv-confirmed{font-family:'Oswald',sans-serif;font-weight:700;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:rgba(52,199,123,.14);color:var(--turf-dim);border:1px solid var(--turf);}
.official-adv{font-family:'Oswald',sans-serif;font-weight:700;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:#33433C;display:flex;align-items:center;gap:5px;justify-content:center;}
.official-adv .af{display:inline-block;width:17px;height:12px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px #E1E6E3;line-height:0;}
.official-adv .af svg{display:block;width:100%;height:100%;}

/* seletor de país (autocomplete) */
.country-search-wrap{position:relative;display:inline-block;}
.country-search-wrap input{
  width:160px;font-size:.73rem;padding:4px 8px;
  border:1px solid #DCE4E0;border-radius:6px;outline:none;
  font-family:'Inter',sans-serif;
}
.country-search-wrap input:focus{border-color:var(--turf);}
.country-dropdown{
  position:absolute;top:calc(100% + 2px);left:0;z-index:200;
  background:#fff;border:1px solid #DCE4E0;border-radius:8px;
  box-shadow:0 4px 14px rgba(0,0,0,.1);
  max-height:180px;overflow-y:auto;min-width:200px;
}
.country-option{
  display:flex;align-items:center;gap:7px;padding:6px 10px;cursor:pointer;
  font-family:'Oswald',sans-serif;font-size:.82rem;font-weight:600;color:#33433C;
}
.country-option:hover{background:#EEF2F0;}
.country-option .cof{display:inline-block;width:22px;height:16px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px #E1E6E3;line-height:0;flex:0 0 auto;}
.country-option .cof svg{display:block;width:100%;height:100%;}
/* admin team inputs inside card */
.ko-team-inputs{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;justify-content:center;}
.ko-team-inputs input{
  font-size:.72rem;padding:4px 8px;border:1px solid #DCE4E0;border-radius:6px;outline:none;
  font-family:'Inter',sans-serif;
}
.ko-team-inputs input:focus{border-color:var(--turf);}
/* barra admin knockout */
.ko-bar{max-width:560px;margin:0 auto 4px;background:#EEF2F0;display:flex;justify-content:center;padding:12px 16px 4px;}
.ko-note{font-family:'Oswald',sans-serif;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;color:#8C9A95;text-align:center;max-width:560px;margin:0 auto;padding:0 0 10px;}


/* ---------- SUB-NAV 1ª / 2ª FASE ---------- */
.subfase-nav{
  display:flex;
  background:var(--surface);
  border-bottom:2px solid var(--line);
}
.subfase-btn{
  flex:1;
  text-align:center;
  padding:10px 8px;
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:.8rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
  background:none;border:none;cursor:pointer;
  border-bottom:3px solid transparent;
  margin-bottom:-2px;
  transition:.15s;
}
.subfase-btn.active{
  color:var(--turf);
  border-bottom-color:var(--turf);
}
.subfase-btn:hover{color:var(--cream);}

@media (max-width:480px){
  .match-row .side .flag{font-size:1.2rem;}
  .match-row .score input{width:34px;height:34px;font-size:1.05rem;}
  .match-row{padding:12px;}
  .match-row .side{font-size:.78rem;}
  .round-nav .rn-title{min-width:110px;font-size:.82rem;}
}
</style>
</head>

function normTeam(s){
  return (s||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/republic|island|kingdom|the|fc|national/g,"")
    .replace(/[^a-z]/g,"");
}

function dateToISO(dStr){
  const [dd, mm] = dStr.split("/");
  return `2026-${mm}-${dd}`;
}

async function fetchDayEvents(dateISO){
  try{
    const url = `https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/eventsday.php?d=${dateISO}&l=${SPORTSDB_LEAGUE_ID}`;
    const res = await fetch(url);
    const data = await res.json();
    return data.events || [];
  }catch(e){ return []; }
}

// Busca resultados na API e atualiza os jogos que ainda não foram editados manualmente.
async function autoUpdateResults(){
  if(!AUTO_UPDATE_ENABLED) return;
  let changed = false;
  const dates = [...new Set(MATCHES.map(m=>m.d))];
  for(const d of dates){
    const events = await fetchDayEvents(dateToISO(d));
    if(!events.length) continue;
    for(const ev of events){
      if(ev.intHomeScore===null || ev.intAwayScore===null || ev.intHomeScore===undefined) continue;
      const evHome = normTeam(ev.strHomeTeam);
      const evAway = normTeam(ev.strAwayTeam);
      const match = MATCHES.find(m =>
        m.d===d && normTeam(m.he)===evHome && normTeam(m.ae)===evAway
      );
      if(!match) continue;
      if(state.manualResults.includes(match.id)) continue;
      const h = String(ev.intHomeScore), a = String(ev.intAwayScore);
      const cur = state.results[match.id];
      if(!cur || cur.h!==h || cur.a!==a){
        state.results[match.id] = {h, a};
        changed = true;
      }
    }
  }
  if(changed){
    await storeSet(RESULTS_KEY, state.results);
  }
  state.lastAutoUpdate = new Date();
  const typing = document.activeElement && document.activeElement.tagName === "INPUT";
  if(!typing) render();
}

function dateLabel(dStr){
  const [dd, mm] = dStr.split("/").map(Number);
  const matchDate = new Date(2026, mm - 1, dd);
  const today = new Date();
  const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const diffDays = Math.round((matchDate - t0) / 86400000);
  if(diffDays === 0) return "Hoje";
  if(diffDays === -1) return "Ontem";
  if(diffDays === 1) return "Amanhã";
  return null;
}

// Verifica se o jogo já começou, considerando data/hora em horário de Brasília (UTC-3)
function matchStarted(match){
  const [dd, mm] = match.d.split("/").map(Number);
  const [hh, mi] = match.t.split(":").map(Number);
  const startUTC = new Date(Date.UTC(2026, mm - 1, dd, hh + 3, mi));
  return new Date() >= startUTC;
}

// Verifica se um jogo do mata-mata já começou (bloqueia palpites após o início)
function koGameStarted(game){
  const [dd, mm] = game.date.split("/").map(Number);
  const [hh, mi] = game.time.split(":").map(Number);
  const startUTC = new Date(Date.UTC(2026, mm - 1, dd, hh + 3, mi));
  return new Date() >= startUTC;
}

function slug(name){
  return "palpites_" + name.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,40);
}

// ---------- ARMAZENAMENTO ----------
// 1) Dentro do Claude.ai (artefato publicado): usa window.storage (compartilhado entre todos).
// 2) Hospedado fora (Vercel etc.): se FIREBASE_DB_URL estiver preenchida, usa o Firebase
//    Realtime Database (gratuito) - todos compartilham os mesmos dados.
// 3) Sem nenhum dos dois: usa localStorage (salva só neste navegador/computador).
const FIREBASE_DB_URL = "https://bolao-financeiro-default-rtdb.firebaseio.com"; // projeto: bolao-financeiro

const STORAGE_MODE = window.storage
  ? "claude"
  : (FIREBASE_DB_URL ? "firebase" : "local");

async function storeGet(key){
  if(STORAGE_MODE === "claude"){
    try{
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  if(STORAGE_MODE === "firebase"){
    try{
      const res = await fetch(`${FIREBASE_DB_URL}/bolao/${key}.json`);
      const data = await res.json();
      return data === null ? null : data;
    }catch(e){ return null; }
  }
  try{
    const v = localStorage.getItem("bolao_"+key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}

async function storeSet(key, val){
  if(STORAGE_MODE === "claude"){
    try{ await window.storage.set(key, JSON.stringify(val), true); }
    catch(e){ console.error("storage set falhou", e); }
    return;
  }
  if(STORAGE_MODE === "firebase"){
    try{
      await fetch(`${FIREBASE_DB_URL}/bolao/${key}.json`, {
        method: "PUT",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(val)
      });
    }catch(e){ console.error("firebase set falhou", e); }
    return;
  }
  try{ localStorage.setItem("bolao_"+key, JSON.stringify(val)); }
  catch(e){ console.error("localStorage set falhou", e); }
}

function debounce(fn, ms){
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), ms); };
}

function calcPoints(pick, real){
  if(!pick || !real) return null;
  if(pick.h===undefined||pick.h===null||pick.h===""||pick.a===""||pick.a===undefined||pick.a===null) return null;
  if(real.h===undefined||real.h===null||real.h===""||real.a===""||real.a===undefined||real.a===null) return null;
  const ph=+pick.h, pa=+pick.a, rh=+real.h, ra=+real.a;
  if([ph,pa,rh,ra].some(isNaN)) return null;
  if(ph===rh && pa===ra) return 3;
  const s1 = Math.sign(ph-pa), s2 = Math.sign(rh-ra);
  return s1===s2 ? 1 : 0;
}

/* =====================================================================
 * PONTUAÇÃO 2ª FASE
 * 3pts placar exato | 1pt resultado | +1pt bônus quem avança (só em empate)
 * ===================================================================== */
function calcPointsKO(pick, realScore, realAdvance){
  if(!pick||!realScore) return null;
  if(pick.h===""||pick.h===undefined||pick.h===null) return null;
  if(pick.a===""||pick.a===undefined||pick.a===null) return null;
  if(realScore.h===""||realScore.h===undefined||realScore.h===null) return null;
  if(realScore.a===""||realScore.a===undefined||realScore.a===null) return null;
  const ph=+pick.h, pa=+pick.a, rh=+realScore.h, ra=+realScore.a;
  if([ph,pa,rh,ra].some(isNaN)) return null;
  let pts=0;
  if(ph===rh && pa===ra) pts+=3;
  else if(Math.sign(ph-pa)===Math.sign(rh-ra)) pts+=1;
  if(rh===ra && realAdvance && pick.advance && pick.advance===realAdvance) pts+=1;
  return pts;
}

function matchScoreInputs(match, mode){
  let hVal="", aVal="", confirmed=false;
  if(mode==="palpites" && state.active){
    const p = state.picks[state.active]?.[match.id];
    if(p){ hVal = p.h ?? ""; aVal = p.a ?? ""; confirmed = !!p.locked; }
  } else if(mode==="resultados" || mode==="resultados-view"){
    const r = state.results[match.id];
    if(r){ hVal = r.h ?? ""; aVal = r.a ?? ""; }
  }
  const lockedByKickoff = mode==="palpites" && matchStarted(match);
  const lockedByConfirm = mode==="palpites" && confirmed && !state.resultsUnlocked;
  const dis = (lockedByKickoff || lockedByConfirm || mode==="resultados-view") ? "disabled" : "";
  return `
    <div class="score">
      <input type="number" min="0" max="20" inputmode="numeric" placeholder="${mode==='resultados-view' ? '-' : ''}" value="${hVal}" ${dis}
        data-match="${match.id}" data-side="h" data-mode="${mode}">
      <span class="x">×</span>
      <input type="number" min="0" max="20" inputmode="numeric" placeholder="${mode==='resultados-view' ? '-' : ''}" value="${aVal}" ${dis}
        data-match="${match.id}" data-side="a" data-mode="${mode}">
    </div>`;
}

function pointsBadge(match){
  if(!state.active) return "";
  const real = state.results[match.id];
  const pick = state.picks[state.active]?.[match.id];
  const pts = calcPoints(pick, real);
  if(real===undefined || real?.h==="" || real?.h===undefined){
    return `<span class="badge pending">Aguardando</span>`;
  }
  if(pts===null) return `<span class="badge pending">Sem palpite</span>`;
  if(pts===3) return `<span class="badge exact">+3 placar exato</span>`;
  if(pts===1) return `<span class="badge result">+1 resultado</span>`;
  return `<span class="badge miss">0 pts</span>`;
}

function realRow(match){
  const r = state.results[match.id];
  if(r===undefined || r?.h==="" || r?.h===undefined || r?.a===""||r?.a===undefined) return "";
  return `<div class="real-row"><span>Resultado oficial</span><b>${r.h} × ${r.a}</b></div>`;
}

// Conteúdo interno do .match-foot (resultado oficial, pontuação e confirmação de palpite)
function footContent(match){
  const r = state.results[match.id];
  const hasResult = r && r.h!=="" && r.h!==undefined && r.a!=="" && r.a!==undefined;
  const resultLine = hasResult
    ? `<span class="saiba result-line">
         ${flagSVG(match.hi,"mini-flag")}
         ${r.h} × ${r.a}
         ${flagSVG(match.ai,"mini-flag")}
       </span>`
    : `<span class="saiba" style="color:#B7C2BD">Aguardando resultado</span>`;

  const pick = state.picks[state.active]?.[match.id];
  const started = matchStarted(match);
  const hasPick = pick && pick.h!=="" && pick.h!==undefined && pick.a!=="" && pick.a!==undefined;
  const confirmed = pick && pick.locked;

  let confirmRow = "";
  if(!started){
    if(confirmed){
      confirmRow = `<div class="confirm-row">
          <span class="confirmed-badge">✅ Palpite confirmado</span>
          ${state.resultsUnlocked ? `<button class="unlock-pick-btn" data-unlock-pick="${match.id}">🔓 Desbloquear</button>` : ""}
        </div>`;
    } else if(hasPick){
      confirmRow = `<div class="confirm-row">
          <button class="confirm-btn" data-confirm-pick="${match.id}">✅ Confirmar palpite</button>
        </div>`;
    }
  }

  return `${resultLine}${pointsBadge(match)}${confirmRow}`;
}

function matchRow(match, mode){
  const accent = groupColor(match.g);
  const rel = dateLabel(match.d);
  const dateBits = [match.d];
  if(rel) dateBits.push(rel);
  dateBits.push(match.t);

  const foot = mode==="palpites"
    ? `<div class="match-foot">${footContent(match)}</div>`
    : "";

  const pick = mode==="palpites" ? state.picks[state.active]?.[match.id] : null;
  let lockedTag = "";
  if(mode==="palpites"){
    if(matchStarted(match)) lockedTag = `<span class="lock-tag">🔒 Iniciado</span>`;
    else if(pick && pick.locked) lockedTag = `<span class="lock-tag confirmed">✅ Confirmado</span>`;
  }

  return `
    <div class="match-row" style="--accent:${accent}">
      <div class="match-head">
        <span class="stadium">${match.st}</span>&nbsp; ${dateBits.join(" • ")}
        <span class="group-tag">${match.g}</span>
        ${lockedTag}
      </div>
      <div class="match-body">
        <div class="side home"><span class="tname">${match.h}</span>${flagSVG(match.hi,"flag")}</div>
        ${matchScoreInputs(match, mode)}
        <div class="side away">${flagSVG(match.ai,"flag")}<span class="tname">${match.a}</span></div>
      </div>
      ${foot}
    </div>`;
}

async function renderContent(){
  const content = document.getElementById("content");

  if(state.tab==="palpites"){
    if(!state.active){
      content.innerHTML = `<div class="empty">Adicione seu nome acima para começar a registrar seus palpites ⚽</div>`;
      return;
    }
    if(state.subfase==="f1"){
      // ── 1ª FASE: grupos ──
      await ensurePicks(state.active);
      content.innerHTML = `<div class="match-list">${filteredMatches().map(m=>matchRow(m,"palpites")).join("")}</div>`;
      bindScoreInputs("palpites");
      content.querySelectorAll(".match-foot").forEach(bindFootActions);
    } else {
      // ── 2ª FASE: eliminatórias ──
      await ensureKOPicks(state.active);
      const koHtml = await buildKOSection("palpites");
      content.innerHTML = koHtml;
      bindKOSection(content,"palpites");
    }
  }

  else if(state.tab==="resultados"){
    const mode = state.resultsUnlocked ? "resultados" : "resultados-view";

    const bar = `
      <div class="results-bar" style="justify-content:center">
        <div class="results-bar-actions">
          ${state.resultsUnlocked
            ? `<button id="lockBtn" class="bar-btn">🔒 Bloquear edição</button>`
            : `<button id="unlockBtn2" class="bar-btn primary">Atualizar Placar</button>`}
        </div>
      </div>`;

    if(state.subfase==="f1"){
      // ── 1ª FASE: grupos ──
      content.innerHTML = bar + `<div class="match-list">${filteredMatches().map(m=>matchRow(m,mode)).join("")}</div>`;
      if(state.resultsUnlocked){
        document.getElementById("lockBtn").addEventListener("click", ()=>{
          state.resultsUnlocked = false;
          try{ sessionStorage.removeItem("bolao_results_unlocked"); }catch(e){}
          render();
        });
        bindScoreInputs("resultados");
      } else {
        document.getElementById("unlockBtn2").addEventListener("click", showPasswordModal);
      }
    } else {
      // ── 2ª FASE: eliminatórias ──
      const koHtml = await buildKOSection(state.resultsUnlocked ? "admin" : "view");
      content.innerHTML = bar + koHtml;
      if(state.resultsUnlocked){
        document.getElementById("lockBtn").addEventListener("click", ()=>{
          state.resultsUnlocked = false;
          try{ sessionStorage.removeItem("bolao_results_unlocked"); }catch(e){}
          render();
        });
      } else {
        document.getElementById("unlockBtn2").addEventListener("click", showPasswordModal);
      }
      bindKOSection(content, state.resultsUnlocked ? "admin" : "view");
    }
  }

  else if(state.tab==="classificacao"){
    if(state.participants.length===0){
      content.innerHTML = `<div class="empty">Nenhum participante cadastrado ainda. Vá na aba "Palpites" e adicione participantes.</div>`;
      return;
    }
    for(const p of state.participants) await ensurePicks(p);

    const rows = state.participants.map(name=>{
      let total=0, exact=0, hit=0, played=0;
      for(const m of MATCHES){
        const real = state.results[m.id];
        const pick = state.picks[name]?.[m.id];
        const pts = calcPoints(pick, real);
        if(pts!==null){
          played++;
          total += pts;
          if(pts===3) exact++;
          if(pts===1) hit++;
        }
      }
      return {name, total, exact, hit, played};
    }).sort((a,b)=>{
      // 1º critério: maior pontuação total
      if(b.total !== a.total) return b.total - a.total;
      // 2º critério (desempate): maior número de placares exatos (3 pts)
      if(b.exact !== a.exact) return b.exact - a.exact;
      // 3º critério (desempate): maior número de resultados certos (1 pt)
      return b.hit - a.hit;
    });

    // Participantes com os mesmos 3 critérios ficam na mesma posição;
    // o próximo grupo pula as posições correspondentes
    let pos = 1;
    const positioned = rows.map((r, i)=>{
      if(i > 0){
        const prev = rows[i-1];
        if(r.total !== prev.total || r.exact !== prev.exact || r.hit !== prev.hit) pos = i+1;
      }
      return {...r, pos};
    });

    content.innerHTML = `<div class="board">${positioned.map(r=>`
      <div class="board-row" data-pos="${r.pos}">
        <div class="rank">${r.pos}</div>
        <div class="board-name">${r.name}</div>
        <div class="board-stats">
          <div>${r.exact} <span>Exatos</span></div>
          <div>${r.hit} <span>Resultados</span></div>
          <div>${r.played}/${MATCHES.length} <span>Jogos</span></div>
          <div class="pts">${r.total}<span>pts</span></div>
        </div>
      </div>`).join("")}</div>`;
  }
  else if(state.tab==="classificacao2"){
    await renderKOClassif(content);
  }
  // PALPITES 2ª FASE — embutido na aba Palpites via sub-phase nav
  // RESULTADOS 2ª FASE — embutido na aba Resultados via sub-phase nav
}

function bindScoreInputs(mode){
  document.querySelectorAll(`input[data-mode="${mode}"]`).forEach(inp=>{
    inp.addEventListener("input", async ()=>{
      const id = +inp.dataset.match;
      const side = inp.dataset.side;
      let v = inp.value;
      if(v!=="" ){
        let n = Math.max(0, Math.min(20, parseInt(v,10)||0));
        v = String(n);
        inp.value = v;
      }
      if(mode==="palpites"){
        const obj = state.picks[state.active][id] || {};
        obj[side] = v;
        state.picks[state.active][id] = obj;
        // não persiste ainda: só salva de fato quando o usuário confirmar o palpite no pop-up
        // atualiza badge/linha de resultado sem re-renderizar tudo
        refreshCardFeedback(id);

        // se os dois placares foram preenchidos e o palpite ainda não foi confirmado,
        // pede confirmação automaticamente
        const pick = state.picks[state.active][id];
        const bothFilled = pick.h!=="" && pick.h!==undefined && pick.a!=="" && pick.a!==undefined;
        const match = MATCHES.find(m=>m.id===id);
        if(bothFilled && !pick.locked && !matchStarted(match) && pendingConfirmMatchId===null){
          inp.blur();
          showConfirmModal(id);
        }
      } else {
        const obj = state.results[id] || {};
        obj[side] = v;
        state.results[id] = obj;
        saveResults();
        if(!state.manualResults.includes(id)){
          state.manualResults.push(id);
          storeSet(MANUAL_KEY, state.manualResults);
        }
        refreshAllBadgesFor(id);
      }
    });
  });
}

  const confirmBtn = footEl.querySelector("[data-confirm-pick]");
  if(confirmBtn){
    confirmBtn.addEventListener("click", ()=> showConfirmModal(+confirmBtn.dataset.confirmPick));

  const unlockBtn = footEl.querySelector("[data-unlock-pick]");

// Confirmação de palpite para jogos do mata-mata
function showKOConfirmModal(gameId){
  const allGames = KO_PHASES.flatMap(ph=>ph.games);
  const game = allGames.find(g=>g.id===gameId);
  const pick = state.koPicks[state.active]?.[gameId] || {};
  pendingConfirmKOId = gameId;

  // Resolver os times do jogo
  const koCard = document.querySelector(`[data-ko="${gameId}"][data-side="h"]`);
  const hName = koCard?.closest(".ko-card")?.querySelector(".ko-team.home .tn")?.textContent || "?";
  const aName = koCard?.closest(".ko-card")?.querySelector(".ko-team.away .tn")?.textContent || "?";

  // Buscar times via resolveTeamsOf (reutilizando a lógica do card)
  const saved = state.koTeams[gameId] || {};
  const seed = { h: game.ih||null, hn: game.ihn||null, a: game.ia||null, an: game.ian||null };

  function _winnerOf(gid){
    const res = state.koResults[gid];
    if(!res||res.h===undefined||res.h==="") return null;
    if(+res.h>+res.a) return "h"; if(+res.a>+res.h) return "a";
    return state.koAdvance[gid]||null;
  }
  function _resolveTeams(gid){
    const s2=state.koTeams[gid]||{};
    const allG=KO_PHASES.flatMap(ph=>ph.games);
    const g2=allG.find(x=>x.id===gid);
    if(!g2) return {};
    return {h:s2.h??g2.ih??null,hn:s2.hn??g2.ihn??null,a:s2.a??g2.ia??null,an:s2.an??g2.ian??null};
  }
  function _getWinner(gid){
    const w=_winnerOf(gid);
    if(!w) return {c:null,n:"A definir"};
    const t=_resolveTeams(gid);
    return w==="h"?{c:t.h,n:t.hn||"?"}:{c:t.a,n:t.an||"?"};
  }

  let tH={c:seed.h,n:seed.hn}, tA={c:seed.a,n:seed.an};
  if(game.r32h) tH=_getWinner(game.r32h);
  if(game.r32a) tA=_getWinner(game.r32a);
  if(game.r16h) tH=_getWinner(game.r16h);
  if(game.r16a) tA=_getWinner(game.r16a);
  if(game.qfh)  tH=_getWinner(game.qfh);
  if(game.qfa)  tA=_getWinner(game.qfa);
  const fH = tH.c ? `<span class="mini-flag">${FLAG_SVG[tH.c]||""}</span>` : "";
  const fA = tA.c ? `<span class="mini-flag">${FLAG_SVG[tA.c]||""}</span>` : "";

  document.getElementById("confirmText").innerHTML =
    `<div class="confirm-score-line">
       ${fH} ${tH.n}
       <b>${pick.h} × ${pick.a}</b>
       ${tA.n} ${fA}
     </div>` +
    `<br>Depois de confirmado, somente o administrador (com senha) poderá alterar este palpite. Confirmar?`;
  document.getElementById("confirmModal").style.display = "flex";
}
function hideConfirmModal(){
  document.getElementById("confirmModal").style.display = "none";
  pendingConfirmMatchId = null;
  pendingConfirmKOId = null;
}

async function init(){
  try{ if(sessionStorage.getItem("bolao_results_unlocked")==="1") state.resultsUnlocked = true; }catch(e){}
  const note = document.getElementById("shareNote");
  if(STORAGE_MODE === "local"){
    note.innerHTML = "⚠️ Armazenamento compartilhado não configurado: os dados ficam salvos só neste navegador/computador (não sincronizam entre pessoas).";
  } else {
    note.textContent = "Os palpites e resultados ficam salvos para todos que abrirem este bolão.";
  }
  state.participants = await storeGet(PARTICIPANTS_KEY) || [];
  state.results = await storeGet(RESULTS_KEY) || {};

  // aplica resultados pré-preenchidos (SEED_RESULTS) que ainda não existirem
  let seeded = false;
  for(const [id, r] of Object.entries(SEED_RESULTS)){
    if(!state.results[id] || state.results[id].h===undefined || state.results[id].h===""){
      state.results[id] = r;
      seeded = true;
    }
  }
  if(seeded) await storeSet(RESULTS_KEY, state.results);

  state.manualResults = await storeGet(MANUAL_KEY) || [];
  state.ko16teams   = await storeGet(KO16_KEY) || {};
  state.ko16results = await storeGet(KO16_RES) || {};
  state.ko16advance = await storeGet(KO16_ADV) || {};

  if(state.participants.length) state.active = state.participants[0];
  render();

  // auto-atualização de resultados (best-effort; falhas são silenciosas)
  autoUpdateResults();
  if(AUTO_UPDATE_ENABLED){
    setInterval(autoUpdateResults, AUTO_REFRESH_MS);
  }
}
init();

    const aTbd = !teams.an ? "tbd" : "";

        <button class="advance-btn ${selA}" data-ko-adv="${slot.id}" data-adv="a">
          ${teams.a?`<span class="aflag">${FLAG_SVG[teams.a]||""}</span>`:""} ${aName}
        </button>
      </div>`;
    } else if(!isAdmin && realAdv){
      const advName = realAdv==="h" ? hName : aName;
      const advCode = realAdv==="h" ? teams.h : teams.a;

      </div>`;

    if(!isAdmin && hasTeams && !pick.locked && !hasResult){

      const selA = pick.advance==="a"?"selected":"";

async function renderClassificacao2(content){
  if(!state.participants.length){
    content.innerHTML=`<div class="empty">Nenhum participante cadastrado ainda.</div>`;
    return;
  }
  for(const p of state.participants) await ensureKO16picks(p);

  const rows = state.participants.map(name=>{
    let total=0,exact=0,hit=0,bonus=0,played=0;
    for(const slot of KO16_SLOTS){
      const pick=state.ko16picks[name]?.[slot.id];
      const rs=state.ko16results[slot.id];
      const hasR=rs&&rs.h!==undefined&&rs.h!=="";
      const pts=calcPointsKO(pick, hasR?rs:null, state.ko16advance[slot.id]);
      if(pts!==null){
        played++;total+=pts;
        if(pts>=3)exact++;
        else if(pts>=1)hit++;
        const ptsNoAdv=calcPointsKO(pick,hasR?rs:null,undefined);
        if(ptsNoAdv!==null && pts>ptsNoAdv) bonus++;
      }
    }
    return {name,total,exact,hit,bonus,played};
  }).sort((a,b)=>{
    if(b.total!==a.total) return b.total-a.total;
    if(b.exact!==a.exact) return b.exact-a.exact;
    return b.hit-a.hit;
  });

  let pos=1;
  const positioned=rows.map((r,i)=>{
    if(i>0){const p=rows[i-1];if(r.total!==p.total||r.exact!==p.exact||r.hit!==p.hit)pos=i+1;}
    return {...r,pos};
  });

  content.innerHTML=`
    <div style="padding:8px 20px 0;max-width:560px;margin:0 auto">
      <p style="font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted);margin:0 0 4px">
        3pts placar exato · 1pt resultado · +1pt quem avança (só em empate)
      </p>
    </div>
    <div class="board">${positioned.map(r=>`
      <div class="board-row" data-pos="${r.pos}">
        <div class="rank">${r.pos}</div>
        <div class="board-name">${r.name}</div>
        <div class="board-stats">
          <div>${r.exact} <span>Exatos</span></div>
          <div>${r.hit} <span>Res.</span></div>
          <div>${r.bonus} <span>Bônus</span></div>
          <div>${r.played}/${KO16_SLOTS.length} <span>Jogos</span></div>
          <div class="pts">${r.total}<span>pts</span></div>
        </div>
      </div>`).join("")}</div>`;
}

// Constrói o card de um jogo de mata-mata
function buildKOCard(game, viewMode){
  // viewMode: "palpites" | "admin" | "view"
  // Usa times pré-definidos no código como seed quando o admin ainda não salvou no Firebase
  // Resolve times do jogo: seed estático (R32) ou propagado do jogo anterior
  function resolveTeam(parentId, side){
    if(!parentId) return {c:null, n:null};
    const res = state.koResults[parentId];
    const teams2 = resolveTeamsOf(parentId);
    if(!res || res.h===undefined || res.h==="") return {c:null, n:null};
    const adv = state.koAdvance[parentId];
    let winner;
    if(+res.h > +res.a) winner = "h";
    else if(+res.a > +res.h) winner = "a";
    else winner = adv; // empate: quem o admin marcou como avançado
    if(!winner) return {c:null, n:null};
    return winner === side
      ? {c: teams2[side==="h"?"h":"a"], n: teams2[side==="h"?"hn":"an"]}
      : {c: teams2[side==="h"?"h":"a"], n: teams2[side==="h"?"hn":"an"]}; // placeholder
  }
  function resolveTeamsOf(gid){
    const saved2 = state.koTeams[gid] || {};
    const allGames = KO_PHASES.flatMap(ph=>ph.games);
    const g2 = allGames.find(x=>x.id===gid);
    if(!g2) return {};
    const seedH = {h: g2.ih||null, hn: g2.ihn||null, a: g2.ia||null, an: g2.ian||null};
    return {
      h:  saved2.h  !== undefined ? saved2.h  : seedH.h,
      hn: saved2.hn !== undefined ? saved2.hn : seedH.hn,
      a:  saved2.a  !== undefined ? saved2.a  : seedH.a,
      an: saved2.an !== undefined ? saved2.an : seedH.an,
    };
  }
  function winnerOf(gid){
    const res = state.koResults[gid];
    const adv = state.koAdvance[gid];
    if(!res || res.h===undefined || res.h==="") return null;
    if(+res.h > +res.a) return "h";
    if(+res.a > +res.h) return "a";
    return adv || null;
  }
  function getTeamByWinner(gid){
    const w = winnerOf(gid);
    if(!w) return {c:null, n:"A definir"};
    const t = resolveTeamsOf(gid);
    return w==="h" ? {c:t.h, n:t.hn||"?"} : {c:t.a, n:t.an||"?"};
  }

  const seed = { h: game.ih||null, hn: game.ihn||null, a: game.ia||null, an: game.ian||null };
  const saved = state.koTeams[game.id] || {};

  // Para jogos sem seed (oitavas em diante), propaga automaticamente o vencedor
  let autoH = {c: seed.h,  n: seed.hn};
  let autoA = {c: seed.a,  n: seed.an};
  if(game.r32h) autoH = getTeamByWinner(game.r32h);
  if(game.r32a) autoA = getTeamByWinner(game.r32a);
  if(game.r16h) autoH = getTeamByWinner(game.r16h);
  if(game.r16a) autoA = getTeamByWinner(game.r16a);
  if(game.qfh)  autoH = getTeamByWinner(game.qfh);
  if(game.qfa)  autoA = getTeamByWinner(game.qfa);

  const teams = {
    h:  saved.h  !== undefined ? saved.h  : autoH.c,
    hn: saved.hn !== undefined ? saved.hn : autoH.n,
    a:  saved.a  !== undefined ? saved.a  : autoA.c,
    an: saved.an !== undefined ? saved.an : autoA.n,
  };
  const hasTeams = !!(teams.hn || teams.an);
  const realScore = state.koResults[game.id] || {};
  const realAdv = state.koAdvance[game.id];
  const hasResult = realScore.h !== undefined && realScore.h !== "";
  const pick = state.active ? (state.koPicks[state.active]?.[game.id] || {}) : {};
  const started = koGameStarted(game);          // jogo já começou?
  const confirmed = !!(pick && pick.locked);    // palpite confirmado?

  const hFlag = teams.h ? `<span class="koflag">${FLAG_SVG[teams.h]||""}</span>` : `<span class="koflag"></span>`;
  const aFlag = teams.a ? `<span class="koflag">${FLAG_SVG[teams.a]||""}</span>` : `<span class="koflag"></span>`;
  const hName = teams.hn || "A definir";
  const aName = teams.an || "A definir";
  const hTbd = !teams.hn ? "tbd" : "";
  const aTbd = !teams.an ? "tbd" : "";

  // score inputs — admin e view mostram resultado oficial; palpites mostram o palpite do participante
  let hV="",aV="";
  if(viewMode==="palpites"){hV=pick.h??"";aV=pick.a??"";}
  else{hV=realScore.h??"";aV=realScore.a??"";}

  // Bloqueio: admin bloqueia após início (sem resultsUnlocked); palpite bloqueia se confirmado ou se iniciou
  const adminLocked = viewMode==="admin" && started && !state.resultsUnlocked;
  const pickLocked  = viewMode==="palpites" && (started || confirmed);
  const canInput = !adminLocked && !pickLocked && (viewMode==="admin" || hasTeams);
  const dis = canInput ? "" : "disabled";
  const kmode = viewMode==="admin" ? "admin" : "pick";

  // Tag de status no cabeçalho do card
  let statusTag = "";
  if(viewMode==="palpites"){
    if(started) statusTag = `<span class="lock-tag">🔒 Iniciado</span>`;
    else if(confirmed) statusTag = `<span class="lock-tag confirmed">✅ Confirmado</span>`;
  }

  const scoreHtml = `<div class="ko-score">
    <input type="number" min="0" max="20" inputmode="numeric" value="${hV}" ${dis}
      data-ko="${game.id}" data-side="h" data-kmode="${kmode}">
    <span class="kox">×</span>
    <input type="number" min="0" max="20" inputmode="numeric" value="${aV}" ${dis}
      data-ko="${game.id}" data-side="a" data-kmode="${kmode}">
  </div>`;

  // admin: quem avançou + picker de países
  let adminFoot="";
  if(viewMode==="admin"){
    const selH=realAdv==="h"?"on":"", selA=realAdv==="a"?"on":"";
    const advHtml = hasTeams ? `<div class="adv-picker">
      <span class="adv-lbl">Quem avançou:</span>
      <button class="adv-btn ${selH}" data-ko-adv="${game.id}" data-adv="h">
        ${teams.h?`<span class="af">${FLAG_SVG[teams.h]||""}</span>`:""} ${hName}
      </button>
      <button class="adv-btn ${selA}" data-ko-adv="${game.id}" data-adv="a">
        ${teams.a?`<span class="af">${FLAG_SVG[teams.a]||""}</span>`:""} ${aName}
      </button>
    </div>` : "";
    const pickersH = buildCountryPicker(game.id,"h",teams.h,teams.hn,false);
    const pickersA = buildCountryPicker(game.id,"a",teams.a,teams.an,false);
    adminFoot = `${advHtml}<div class="ko-team-inputs">${pickersH}${pickersA}</div>`;
  }

  // palpite: quem avança (só antes do resultado + se não confirmado)
  let pickAdvFoot="";
  if(viewMode==="palpites" && hasTeams && !pick.locked && !hasResult){
    const selH=pick.advance==="h"?"on":"", selA=pick.advance==="a"?"on":"";
    pickAdvFoot=`<div class="adv-picker">
      <span class="adv-lbl">Se empatar, avança:</span>
      <button class="adv-btn ${selH}" data-ko-pick-adv="${game.id}" data-adv="h">
        ${teams.h?`<span class="af">${FLAG_SVG[teams.h]||""}</span>`:""} ${hName}
      </button>
      <button class="adv-btn ${selA}" data-ko-pick-adv="${game.id}" data-adv="a">
        ${teams.a?`<span class="af">${FLAG_SVG[teams.a]||""}</span>`:""} ${aName}
      </button>
    </div>`;
  } else if(viewMode==="palpites" && pick.advance && !hasResult){
    const advName=pick.advance==="h"?hName:aName;
    pickAdvFoot=`<span class="adv-confirmed">✅ Aposta: ${advName} avança</span>`;
  }

  // resultado oficial no rodapé — só exibe se não há inputs visíveis (modo palpites sem resultado)
  let officialFoot="";
  if(viewMode==="palpites" && hasResult){
    officialFoot=`<span class="adv-lbl" style="color:#33433C">Resultado: ${realScore.h} × ${realScore.a}</span>`;
    if(realAdv){
      const advName=realAdv==="h"?hName:aName, advCode=realAdv==="h"?teams.h:teams.a;
      officialFoot+=` <span class="official-adv">Avançou: ${advCode?`<span class="af">${FLAG_SVG[advCode]||""}</span>`:""} ${advName}</span>`;
    }
  } else if(viewMode==="view" && realAdv){
    // no modo view o placar já está nos inputs — só mostra quem avançou
    const advName=realAdv==="h"?hName:aName, advCode=realAdv==="h"?teams.h:teams.a;
    officialFoot=`<span class="official-adv">Avançou: ${advCode?`<span class="af">${FLAG_SVG[advCode]||""}</span>`:""} ${advName}</span>`;
  }

  // badge pontuação
  let ptsBadge="";
  if(viewMode==="palpites" && state.active){
    const rs = hasResult ? realScore : null;
    const pts = calcPointsKO(pick, rs, realAdv);
    if(pts===null && !hasResult) ptsBadge=`<span class="badge pending">Aguardando</span>`;
    else if(pts===null) ptsBadge=`<span class="badge pending">Sem palpite</span>`;
    else if(pts>=3) ptsBadge=`<span class="badge exact">+${pts} pts</span>`;
    else if(pts>=1) ptsBadge=`<span class="badge result">+${pts} pt</span>`;
    else ptsBadge=`<span class="badge miss">0 pts</span>`;
  }

  // botão confirmar palpite / desbloquear (apenas no viewMode palpites)
  let confirmRowKO = "";
  if(viewMode==="palpites" && !started){
    if(confirmed){
      confirmRowKO = `<div class="confirm-row">
        <span class="confirmed-badge">✅ Palpite confirmado</span>
        ${state.resultsUnlocked ? `<button class="unlock-pick-btn" data-ko-unlock="${game.id}">🔓 Desbloquear</button>` : ""}
      </div>`;
    } else if((pick.h||"")!=="" && (pick.a||"")!==""){
      confirmRowKO = `<div class="confirm-row">
        <button class="confirm-btn" data-ko-confirm="${game.id}">✅ Confirmar palpite</button>
      </div>`;
    }
  }

  const foot = adminFoot || pickAdvFoot || officialFoot || ptsBadge || confirmRowKO
    ? `<div class="ko-foot">${adminFoot}${pickAdvFoot}${confirmRowKO}${officialFoot}${ptsBadge}</div>` : "";

  return `<div class="ko-card">
    <div class="ko-card-head"><strong>${game.label}</strong> · ${game.desc} · ${game.date} ${game.time} · ${game.city}${statusTag ? " " + statusTag : ""}</div>
    <div class="ko-card-body">
      <div class="ko-team home ${hTbd}">${hFlag}<span class="tn">${hName}</span></div>
      ${scoreHtml}
      <div class="ko-team away ${aTbd}"><span class="tn">${aName}</span>${aFlag}</div>
    </div>
    ${foot}
  </div>`;
}

// Constrói a seção KO completa (com nav de fase + cards) como string HTML
async function buildKOSection(viewMode){
  const phases = KO_PHASES;
  const pills = phases.map(p=>`<button class="ko-pill ${state.koPhase===p.phase?"active":""}" data-kophase="${p.phase}">${p.label}</button>`).join("");
  const ph = phases.find(p=>p.phase===state.koPhase);
  const cards = ph ? ph.games.map(g=>buildKOCard(g,viewMode)).join("") : "";
  return `
    <div class="ko-section" id="koSection">
      <div class="ko-phase-nav">${pills}</div>
      <div class="ko-list" id="koCards">${cards}</div>
    </div>`;
}

// Bind de todos os eventos na seção KO (score inputs, pickers, adv buttons)
function bindKOSection(container, viewMode){
  const sec = container.querySelector("#koSection");
  if(!sec) return;

  // navegação de fase
  sec.querySelectorAll(".ko-pill").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      state.koPhase=btn.dataset.kophase;
      render();
    });
  });

  // score inputs
  sec.querySelectorAll("input[data-ko][data-kmode]").forEach(inp=>{
    inp.addEventListener("input", async()=>{
      const id=+inp.dataset.ko, side=inp.dataset.side;
      let v=inp.value;
      if(v!==""){let n=Math.max(0,Math.min(20,parseInt(v,10)||0));v=String(n);inp.value=v;}
      if(inp.dataset.kmode==="admin"){
        state.koResults[id]=state.koResults[id]||{};
        state.koResults[id][side]=v;
        saveKOResults();
      } else {
        if(!state.active) return;
        state.koPicks[state.active]=state.koPicks[state.active]||{};
        state.koPicks[state.active][id]=state.koPicks[state.active][id]||{};
        state.koPicks[state.active][id][side]=v;
        // não persiste antes da confirmação — apenas atualiza memória
        // auto-abre confirmação ao preencher ambos os campos
        const p=state.koPicks[state.active][id];
        const allGames=KO_PHASES.flatMap(ph=>ph.games);
        const game=allGames.find(g=>g.id===id);
        const bothFilled=(p.h||"")!==""&&(p.a||"")!=="";
        if(bothFilled && !p.locked && !koGameStarted(game) && pendingConfirmKOId===null){
          inp.blur();
          showKOConfirmModal(id);
        } else {
          await saveKOPicks(state.active);
        }
      }
    });
  });

  // quem avança — admin
  sec.querySelectorAll("[data-ko-adv]").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      const id=+btn.dataset.koAdv, adv=btn.dataset.adv;
      state.koAdvance[id]=state.koAdvance[id]===adv?undefined:adv;
      await saveKOResults();
      render();
    });
  });

  // quem avança — participante
  sec.querySelectorAll("[data-ko-pick-adv]").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      const id=+btn.dataset.koPickAdv, adv=btn.dataset.adv;
      if(!state.active) return;
      state.koPicks[state.active]=state.koPicks[state.active]||{};
      state.koPicks[state.active][id]=state.koPicks[state.active][id]||{};
      const cur=state.koPicks[state.active][id].advance;
      state.koPicks[state.active][id].advance=cur===adv?undefined:adv;
      await saveKOPicks(state.active);
      render();
    });
  });

  // botão confirmar palpite KO
  sec.querySelectorAll("[data-ko-confirm]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const id=+btn.dataset.koConfirm;
      if(!state.active) return;
      showKOConfirmModal(id);
    });
  });

  // botão desbloquear palpite KO (admin)
  sec.querySelectorAll("[data-ko-unlock]").forEach(btn=>{
    btn.addEventListener("click",async()=>{
      const id=+btn.dataset.koUnlock;
      if(!state.active) return;
      state.koPicks[state.active]=state.koPicks[state.active]||{};
      state.koPicks[state.active][id]=state.koPicks[state.active][id]||{};
      state.koPicks[state.active][id].locked=false;
      await saveKOPicks(state.active);
      render();
    });
  });

  // autocomplete de país (só admin)
  if(viewMode==="admin") bindCountryPickers(sec);
}

// constrói o HTML completo de uma aba (palpites ou resultados) incluindo fase grupos + KO
async function buildTabContent(mode){
  const matchesHtml = `<div class="match-list">${filteredMatches().map(m=>matchRow(m,mode)).join("")}</div>`;
  const viewMode = mode==="palpites" ? "palpites" : (state.resultsUnlocked?"admin":"view");
  const koHtml = await buildKOSection(viewMode);
  return matchesHtml + koHtml;
}

/* =====================================================================
 * CLASSIFICAÇÃO 2ª FASE
 * ===================================================================== */
async function renderKOClassif(content){
  if(!state.participants.length){
    content.innerHTML=`<div class="empty">Nenhum participante cadastrado ainda.</div>`;
    return;
  }
  for(const p of state.participants) await ensureKOPicks(p);

  const allGames = KO_PHASES.flatMap(ph=>ph.games);

  const rows = state.participants.map(name=>{
    let total=0,exact=0,hit=0,bonus=0,played=0;
    for(const g of allGames){
      const pick=state.koPicks[name]?.[g.id];
      const rs=state.koResults[g.id];
      const hasR=rs&&rs.h!==undefined&&rs.h!=="";
      const pts=calcPointsKO(pick,hasR?rs:null,state.koAdvance[g.id]);
      if(pts!==null){
        played++;total+=pts;
        if(pts>=3)exact++;
        else if(pts>=1)hit++;
        const ptsNoAdv=calcPointsKO(pick,hasR?rs:null,undefined);
        if(ptsNoAdv!==null&&pts>ptsNoAdv)bonus++;
      }
    }
    return {name,total,exact,hit,bonus,played};
  }).sort((a,b)=>{
    if(b.total!==a.total)return b.total-a.total;
    if(b.exact!==a.exact)return b.exact-a.exact;
    return b.hit-a.hit;
  });

  let pos=1;
  const positioned=rows.map((r,i)=>{
    if(i>0){const p=rows[i-1];if(r.total!==p.total||r.exact!==p.exact||r.hit!==p.hit)pos=i+1;}
    return {...r,pos};
  });

  content.innerHTML=`
    <div style="padding:8px 20px 0;max-width:560px;margin:0 auto">
      <p style="font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted);margin:0 0 4px">
        3pts placar exato · 1pt resultado · +1pt quem avança (bônus em empates)
      </p>
    </div>
    <div class="board">${positioned.map(r=>`
      <div class="board-row" data-pos="${r.pos}">
        <div class="rank">${r.pos}</div>
        <div class="board-name">${r.name}</div>
        <div class="board-stats">
          <div>${r.exact} <span>Exatos</span></div>
          <div>${r.hit} <span>Res.</span></div>
          <div>${r.bonus} <span>Bônus</span></div>
          <div>${r.played}/${allGames.length} <span>Jogos</span></div>
          <div class="pts">${r.total}<span>pts</span></div>
        </div>
      </div>`).join("")}</div>`;
}
